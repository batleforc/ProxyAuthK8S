[package]
name = "integration"
version = "0.4.2"
edition = "2024"
license = "MIT"
publish = false
description = "Black-box integration suite against the k3d bench (RFC 0009)"

# No path dependency on the workspace, on purpose: a test can only reach the
# product through what is deployed (RFC 0009 §5.3, checked by it:matrix).
[dependencies]
reqwest = { workspace = true, features = ["form"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["process", "io-util", "time", "net"] }
url = "2"
# RFC 0012 point 12: a client of the agents' listener without an agent
# certificate, spoken by hand. Registry crates already in the tree.
futures-util = { workspace = true, features = ["sink"] }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["handshake"] }
# RFC 0016: the token-in-subprotocol scheme of RFC 0014 point 16.
base64 = "0.22"

[lints]
workspace = true
