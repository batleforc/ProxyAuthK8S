[package]
name = "agent"
version = "0.4.0"
edition = "2024"
license = "MIT"
publish = false
description = "The RFC 0012 agent: dials out to the proxy's agent gateway and relays its streams to the local apiserver"

[[bin]]
name = "proxyauthk8s-agent"
path = "src/main.rs"

[dependencies]
agent_pki = { path = "../../libs/agent/pki", version = "0.4.0" }
agent_proto = { path = "../../libs/agent/proto", version = "0.4.0" }
anyhow = { workspace = true }
axum = { workspace = true }
# Already in the tree (api): the egress proxy's `Proxy-Authorization: Basic`.
base64 = "0.23"
futures-util = { workspace = true, features = ["io"] }
http = "1"
# Already in the tree (reqwest's own proxies): `CONNECT` and SOCKS5 egress (§5.4).
hyper-util = { version = "0.1", features = ["client-legacy", "client-proxy", "tokio"] }
# Already in the tree (url): credentials of an egress proxy URL.
percent-encoding = "2"
# `socks` adds no crate: reqwest's SOCKS5 is hyper-util's, as above.
reqwest = { workspace = true, features = ["socks"] }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Already in the tree (api): the SHA-256 of the remote cluster's CA.
sha2 = "0.11"
tokio = { workspace = true, features = ["net", "time", "io-util", "signal"] }
tokio-rustls = { workspace = true }
# Already in the tree (agent_proto, api's tests): the client handshake.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["compat"] }
tower-service = "0.3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
# The bench's second image only (RFC 0013, decision 5): AGENT_IT_ANNOUNCE_*
# make the agent announce another version or protocol range. Never in a
# published image.
it-announce = []

[lints]
workspace = true
