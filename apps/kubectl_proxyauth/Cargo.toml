[package]
name = "kubectl_proxyauth"
version = "0.6.0"
edition = "2024"
license = "MIT"


[dependencies]
clap = { version = "4.5", features = ["derive"] }
tracing = { workspace = true }
tokio = { workspace = true }

cli_trace = { path = "../../libs/cli/cli_trace" , version = "0.6.0" }
cli = { path = "../../libs/cli/cli" , version = "0.6.0" }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["process", "io-util"] }
wiremock = "0.6"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# `tracing` is not used directly yet (events come from `cli`, the subscriber
# from `cli_trace`); kept on purpose for future events in `main.rs`.
[package.metadata.cargo-machete]
ignored = ["tracing"]

[lints]
workspace = true
