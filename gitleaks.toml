# gitleaks configuration — secret scanning gate (.github/workflows/secret-scan.yaml
# and the pre-commit hook). Local run, identical to CI:
#   GITLEAKS_CONFIG=$PWD/gitleaks.toml gitleaks git .
#
# Extends the full built-in ruleset. The allowlist exempts known test fixtures
# by value, never by path: the scan walks the full history, and a value entry
# survives a rename while still flagging a real credential in the same file.

title = "ProxyAuthK8S gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures — no live secrets"
regexes = [
    # RFC 6455 §1.3's sample Sec-WebSocket-Key ("the sample nonce"), in the
    # integration tests' websocket upgrades.
    '''dGhlIHNhbXBsZSBub25jZQ==''',
    # The unsigned ID token of libs/server/api/tests (signature segment is
    # "signature-not-verified-in-these-tests").
    '''c2lnbmF0dXJlLW5vdC12ZXJpZmllZC1pbi10aGVzZS10ZXN0cw''',
    # TEST_RSA_PRIVATE_KEY_PEM in libs/server/api/tests/harness/mod.rs, a
    # throwaway keypair that only signs test ID tokens.
    '''MIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQCVWDLfDvI6z8rf''',
]
