version: "3"

tasks:
  helm:
    desc: "Run Helm linter"
    silent: true
    cmds:
      - echo "Running lint on helm charts"
      - helm lint deploy/chart-crd
      - helm lint deploy/chart
      # proxy.cluster is required: lint with a placeholder.
      - helm lint deploy/chart-agent --set proxy.cluster=team-a/prod
