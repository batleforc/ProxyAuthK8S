version: "3"

tasks:
  rust:
    desc: "Run Rust linter"
    silent: true
    cmds:
      - echo "Running cargo lint"
      - cargo fmt --all -- --check
      - cargo clippy --all -- -D warnings
  helm:
    desc: "Run Helm linter"
    silent: true
    cmds:
      - echo "Running lint on helm charts"
      - helm lint deploy/chart-crd
      - helm lint deploy/chart
  actions:
    desc: "Lint the GitHub Actions workflows (actionlint + shellcheck)"
    silent: true
    cmds:
      - echo "Running actionlint on .github/workflows"
      # Only the live workflows (not .github/workflows/.bck), and shellcheck
      # findings from `warning` up (style/info notes don't fail the lint).
      - SHELLCHECK_OPTS="--severity=warning" actionlint .github/workflows/*.yml .github/workflows/*.yaml
