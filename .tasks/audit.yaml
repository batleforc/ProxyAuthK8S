version: "3"

tasks:
  default:
    desc: "Run every CVE and policy audit: Rust deps (cargo deny + trivy, kit), the fuzz and perf workspaces, JS deps (pnpm audit), Containerfiles (trivy config, kit)"
    silent: true
    cmds:
      - task: :rust:audit
      - task: fuzz
      - task: perf
      - task: js
      - task: :repo:audit

  fuzz:
    desc: "Audit the separate fuzz/ workspace with the root deny.toml (rust:audit only sees the main workspace)"
    silent: true
    cmds:
      - mise exec -- cargo deny --manifest-path fuzz/Cargo.toml check

  perf:
    desc: "Audit the separate tests/perf workspace with the root deny.toml (rust:audit only sees the main workspace)"
    silent: true
    cmds:
      - mise exec -- cargo deny --manifest-path tests/perf/Cargo.toml check

  js:
    desc: "Audit JS/TS dependencies of every workspace package for known CVEs (pnpm audit)"
    silent: true
    cmds:
      - echo "Auditing JS dependencies with pnpm audit"
      # One lockfile covers front, front-api and docs. Accepted advisories
      # live in pnpm-workspace.yaml (auditConfig.ignoreGhsas).
      - pnpm audit

  image:
    desc: "Build the server, front and agent images (IMAGE=server, front or agent for one) and scan them for HIGH/CRITICAL CVEs with a fix (trivy image). Not in audit:default: the build is too slow for the commit hooks"
    vars:
      IMAGES: '{{.IMAGE | default "server front agent"}}'
      OUT: .task-audit-image
    cmds:
      - |
        set -eu
        engine=docker
        if command -v podman >/dev/null; then engine=podman; fi
        ignore=""; if [ -f .trivyignore.yaml ]; then ignore="--ignorefile .trivyignore.yaml"; fi
        mkdir -p {{.OUT}}; trap 'rm -rf {{.OUT}}' EXIT
        status=0
        for name in {{.IMAGES}}; do
          case "$name" in server) dir=back ;; front) dir=front ;; agent) dir=agent ;; *) echo "IMAGE must be server, front or agent" >&2; exit 1 ;; esac
          image=localhost/proxyauthk8s/$name:audit
          "$engine" build -f "deploy/build/$dir/Containerfile" -t "$image" .
          "$engine" save -o "{{.OUT}}/$name.tar" "$image"
          mise exec -- trivy image --skip-version-check --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed $ignore --input "{{.OUT}}/$name.tar" || status=1
          rm -f "{{.OUT}}/$name.tar"
        done
        exit $status
