version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily

  # One entry for the whole pnpm workspace (front, front-api, docs).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily

  # RFC 0012 §8: the agent image's distroless base, pinned by digest.
  - package-ecosystem: docker
    directory: /deploy/build/agent
    schedule:
      interval: weekly
