# `cooldown` waits seven days after a release before proposing it (a
# compromised release is usually yanked by then). Security updates don't wait.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  # One entry for the whole pnpm workspace (front, front-api, docs).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  # RFC 0012 §8: the agent image's distroless base, pinned by digest.
  - package-ecosystem: docker
    directory: /deploy/build/agent
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
