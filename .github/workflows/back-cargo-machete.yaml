name: 🦀 Rust dependency machete

on:
  push:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/scripts/check-workspace-deps.py"
      - ".github/workflows/back-cargo-machete.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/scripts/check-workspace-deps.py"
      - ".github/workflows/back-cargo-machete.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-machete:
    name: Check for unused Rust dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: stable

      # The bnjbvr/cargo-machete action pulls in clechasseur/rs-cargo, which the
      # repository's action allowlist rejects: install the binary instead.
      - name: Install cargo-machete
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-machete

      - name: Machete
        run: cargo machete

      - name: Check unused workspace dependencies
        run: python3 .github/scripts/check-workspace-deps.py
