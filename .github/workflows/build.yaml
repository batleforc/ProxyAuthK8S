name: Container Build and Report CVE

on:
  push:
    branches: ["main"]
    paths:
      # Rebuild and rescan when an image recipe or a locked dependency changes.
      - "deploy/build/**"
      - "Cargo.lock"
      - "yarn.lock"
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["main"]
    paths:
      # Rebuild and rescan when an image recipe or a locked dependency changes.
      - "deploy/build/**"
      - "Cargo.lock"
      - "yarn.lock"
  workflow_dispatch:
  schedule:
    - cron: "50 23 * * *"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build container images
    runs-on: ubuntu-latest
    strategy:
      # Each image builds on its own: a broken front must not cancel the back
      # and hide its state (and vice versa).
      fail-fast: false
      matrix:
        include:
          - name: "Backend Container"
            context: .
            dockerfile: deploy/build/back/Containerfile
            image_name: ${{ github.repository_owner }}/proxyauthk8s/server
          - name: "Frontend Container"
            context: .
            dockerfile: deploy/build/front/Containerfile
            image_name: ${{ github.repository_owner }}/proxyauthk8s/front
    permissions:
      contents: read
      packages: write
    outputs:
      image_backend: ${{ env.REGISTRY }}/${{ github.repository_owner }}/proxyauthk8s/server:${{ github.sha }}
      image_frontend: ${{ env.REGISTRY }}/${{ github.repository_owner }}/proxyauthk8s/front:${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Image
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # GITHUB_REF_NAME is `<n>/merge` on a PR and may hold `/` on a branch,
          # neither of which is a valid image tag.
          if [ -n "$PR_NUMBER" ]; then
            REF_TAG="pr-${PR_NUMBER}"
          else
            REF_TAG="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[.-]*//' | cut -c1-128)"
          fi
          # A name made only of `.`/`-` (or unsupported characters) sanitizes to nothing.
          REF_TAG="${REF_TAG:-branch}"
          IMAGE_TAG="${{ env.REGISTRY }}/${{ matrix.image_name }}:${GITHUB_SHA}"
          IMAGE_TAG_BRANCH="${{ env.REGISTRY }}/${{ matrix.image_name }}:${REF_TAG}"
          docker buildx build \
            --platform linux/amd64 \
            --tag "$IMAGE_TAG" \
            --tag "$IMAGE_TAG_BRANCH" \
            --file ${{ matrix.dockerfile }} \
            --push ${{ matrix.context }}

  scan:
    name: Scan container images for CVEs
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "Backend Container"
            image_name: ${{ github.repository_owner }}/proxyauthk8s/server
            artifact_name: trivy-backend
          - name: "Frontend Container"
            image_name: ${{ github.repository_owner }}/proxyauthk8s/front
            artifact_name: trivy-frontend
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan Image for CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image_name }}:${{ github.sha }}
          format: sarif
          output: trivy-report.sarif
      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: trivy-report.sarif

  upload-sarif:
    name: Upload SARIF to GitHub Security
    needs: scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - artifact_name: trivy-backend
          - artifact_name: trivy-frontend
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Download SARIF artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact_name }}
      - name: Upload scan results to GitHub
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-report.sarif
          wait-for-processing: true
