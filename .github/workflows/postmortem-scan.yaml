name: postmortem supply-chain gate

# Dogfoods mlab-sh/postmortem against every dependency graph in the repo:
# the root Cargo workspace and the pnpm workspace (front, front-api and the
# docs site share one lockfile). `online` scores each dependency's
# source repo for reputation/provenance, `vulns` queries known advisories.
# Complements back-dep-audit.yaml (Rust-only, RustSec) and
# dependency-review.yml (PR-only, GHSA) rather than replacing them.

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/front/package.json"
      - "libs/front/front-api/package.json"
      - ".docs/package.json"
      - ".github/workflows/postmortem-scan.yaml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/front/package.json"
      - "libs/front/front-api/package.json"
      - ".docs/package.json"
      - ".github/workflows/postmortem-scan.yaml"
  schedule:
    - cron: "15 5 * * 1" # weekly — catch newly-published advisories on pinned deps
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: postmortem gate (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # for the SARIF upload to Code Scanning
    # One target per job: Code Scanning refuses a single SARIF holding several
    # runs under the same category, and the action exposes no `category` input.
    # The matrix value lands in upload-sarif's automatic category instead.
    strategy:
      fail-fast: false
      matrix:
        target:
          - Cargo.lock
          - pnpm-lock.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: postmortem supply-chain gate
        uses: mlab-sh/postmortem@v2.9.0
        with:
          # The action's `version` input picks the binary it downloads and
          # defaults to an older release; keep it on the same tag as the action.
          version: v2.9.0
          path: ${{ matrix.target }}
          online: true # resolve crates.io/npm -> source repo for reputation scoring
          vulns: true
          fail-on-vuln: high # block only on High+ advisories
          sarif: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vuln-token: ${{ secrets.VULN_MLAB_TOKEN }} # optional — raises the rate limit
