name: 🌐 Frontend ESLint Analysis

# 🔍 This workflow runs ESLint static analysis on Vue.js and TypeScript files
# to ensure code quality, consistency, and catch potential issues early.
# Integrates with GitHub Security for centralized reporting.
on:
  push:
    branches: ["main"]
    paths:
      - "**/*.vue" # 🎨 Vue.js components
      - "**/*.ts" # 📘 TypeScript files
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.vue" # 🎨 Vue.js components
      - "**/*.ts" # 📘 TypeScript files
  schedule:
    - cron: "50 23 * * *" # 🕚 Daily at 23:50 UTC for security scanning
  workflow_dispatch: # 🚀 Allow manual triggering

permissions:
  contents: read

jobs:
  eslint:
    name: 🔍 Run ESLint Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read # 📖 Read repository contents
      security-events: write # 🔒 Write security analysis results
      actions: read # ⚡ Read action status (required for private repos)
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Reads the "packageManager" pin in package.json.

      - name: 📦 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: "pnpm" # 🚀 Speed up builds with the pnpm store cache
          node-version: "24"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile
        # 📋 The SARIF formatter is a root devDependency: the lockfile never changes in CI

      - name: 🔍 Run ESLint Analysis
        run: pnpm --filter @proxy-auth-k8s/front run lint
          --format @microsoft/eslint-formatter-sarif
          --output-file eslint-results.sarif
        continue-on-error: true
        # 🎯 The script runs in apps/front, so the report lands where the upload reads it

      - name: 📤 Upload Results to GitHub Security
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: apps/front/eslint-results.sarif
          wait-for-processing: true
        # 🔒 Upload linting results to GitHub Security tab for visibility

  check:
    name: ✅ Typecheck and test the frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Reads the "packageManager" pin in package.json.

      - name: 📦 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: "pnpm"
          node-version: "24"

      - name: 🛠️ Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ✅ Typecheck, test and build
        # Unlike the ESLint job above (report-only), this one fails the run.
        run: task js:ci

      - name: 🔒 Lockfile untouched
        run: git diff --exit-code pnpm-lock.yaml
