name: 🧪 Integration suite (not concerned)

# `integration` is a required check on main (RFC 0009 §13), but
# integration.yaml only runs for the paths below. A PR that touches none of
# them gets this job of the same name, which passes, instead of a check that
# never reports and blocks the merge. Keep the list identical to the
# pull_request paths of integration.yaml.
on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "apps/**"
      - "libs/**"
      - "deploy/**"
      - "tests/integration/**"
      - ".it/**"
      - ".tasks/integration.yaml"
      - ".config/nextest.toml"
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - ".github/workflows/integration.yaml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - run: echo "No path of the integration suite changed."
