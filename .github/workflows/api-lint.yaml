name: 🦀 Rust API Lint Spectral

on:
  push:
    branches: ["main", "*"]
    paths:
      - "swagger.json"
      - ".spectral.yaml"
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["main"]
    paths:
      - "swagger.json"
      - ".spectral.yaml"
  workflow_dispatch:
  schedule:
    - cron: "50 23 * * *"

permissions:
  contents: read

jobs:
  rust-spectral-analyze:
    name: Run rust-spectral analyzing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 📦 Setup pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: "pnpm"
      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Spectral lint
        run: task gen:api-lint
      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: spectral-report.sarif
          wait-for-processing: true
