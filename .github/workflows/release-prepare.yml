name: Release Prepare

on:
  push:
    tags:
      - "v*.*.*"

# This workflow is triggered when a new tag matching the pattern "v*.*.*" is pushed.
# It will be split into multiple steps (Max dont forget to update the ci when reaching v0.4.0):
# - Build and push the Docker image to Github
#   - Back
#   - Front
#   - All In One Image (Only in V0.4.0) (contains the back and the front, do i expose the front by the back ?)
# - Build and push the Helm chart to Github
#   - CRD
#   - Chart
# - Create a draft release on github with the generated changelog by Cocogitto

env:
  REGISTRY: ghcr.io
  REPO_NAME_LOWER: ${{ format('{0}', github.event.repository.name) }}
  CHART_BASE_ARTEFACT: ${{ github.repository_owner }}/proxyauthk8s
  IMAGE_NAME_SERVER: ${{ github.repository_owner }}/proxyauthk8s/server
  IMAGE_NAME_FRONT: ${{ github.repository_owner }}/proxyauthk8s/front

permissions:
  contents: read

jobs:
  gather-facts:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      name: ${{ steps.set-name.outputs.name }}
    steps:
      - name: Set version
        id: set-version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Set name
        id: set-name
        run: |
          if [ -z "$GITHUB_HEAD_REF" ]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_HEAD_REF}" >> $GITHUB_OUTPUT
          fi
  build-and-push-back:
    name: 🐳 Build and push Back image
    permissions:
      packages: write
    needs: gather-facts
    runs-on: ubuntu-latest
    outputs:
      server_image: ${{ steps.build_server.outputs.image }}
    steps:
      - name: Build and push back image
        run: echo "Build and push back image with version ${{ needs.gather-facts.outputs.version }} and latest tag"
      - name: 🔍 Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: 🔐 Login to Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build Server Image
        id: build_server
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}:${{ needs.gather-facts.outputs.version }}"
          LATEST_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}:latest"

          docker buildx build \
            --platform linux/amd64 \
            --tag $IMAGE_TAG \
            --tag $LATEST_TAG \
            --file deploy/build/back/Containerfile \
            --push .

          echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: 📋 Generate SBOM for Server
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.build_server.outputs.image }}
          format: cyclonedx-json
          output-file: server-sbom.json
  build-and-push-front:
    name: 🐳 Build and push front image
    permissions:
      packages: write
    needs: gather-facts
    runs-on: ubuntu-latest
    outputs:
      front_image: ${{ steps.build_front.outputs.image }}
    steps:
      - name: Build and push front image
        run: echo "Build and push front image with version ${{ needs.gather-facts.outputs.version }} and latest tag"
      - name: 🔍 Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: 🔐 Login to Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build Front Image
        id: build_front
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONT }}:${{ needs.gather-facts.outputs.version }}"
          LATEST_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONT }}:latest"

          docker buildx build \
            --platform linux/amd64 \
            --tag $IMAGE_TAG \
            --tag $LATEST_TAG \
            --file deploy/build/front/Containerfile \
            --push .

          echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: 📋 Generate SBOM for Front
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.build_front.outputs.image }}
          format: cyclonedx-json
          output-file: front-sbom.json

  build-and-push-helm-crd:
    name: ⎈ Build and push crd helm chart
    permissions:
      packages: write
    needs: gather-facts
    runs-on: ubuntu-latest
    steps:
      - name: Build and push crd helm chart
        run: echo "Build and push crd helm chart with version ${{ needs.gather-facts.outputs.version }} and latest tag"
      - name: 🔍 Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⎈ Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: "latest"
      - name: 🔐 Login to Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🔧 Install Helm plugins
        run: |
          helm plugin install https://github.com/chartmuseum/helm-push || true
      - name: ⎈ Package and push Helm Chart
        uses: bsord/helm-push@51f937208fed71540ab5ec5215cf9b3ecae9c7b7 # v4.2.0
        with:
          useOCIRegistry: true
          registry-url: oci://${{ env.REGISTRY }}/${{ env.CHART_BASE_ARTEFACT }}
          username: ${{ github.actor }}
          access-token: ${{ secrets.GITHUB_TOKEN }}
          chart-folder: deploy/chart-crd
  build-and-push-helm:
    name: ⎈ Build and push helm chart
    permissions:
      packages: write
    needs: gather-facts
    runs-on: ubuntu-latest
    steps:
      - name: Build and push helm chart
        run: echo "Build and push helm chart with version ${{ needs.gather-facts.outputs.version }} and latest tag"
      - name: 🔍 Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⎈ Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: "latest"
      - name: 🔐 Login to Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🔧 Install Helm plugins
        run: |
          helm plugin install https://github.com/chartmuseum/helm-push || true
      - name: ⎈ Package and push Helm Chart
        uses: bsord/helm-push@51f937208fed71540ab5ec5215cf9b3ecae9c7b7 # v4.2.0
        with:
          useOCIRegistry: true
          registry-url: oci://${{ env.REGISTRY }}/${{ env.CHART_BASE_ARTEFACT }}
          username: ${{ github.actor }}
          access-token: ${{ secrets.GITHUB_TOKEN }}
          chart-folder: deploy/chart

  build-cli:
    name: 🔌 Build the kubectl plugin
    permissions:
      contents: read
    needs:
      - gather-facts
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: kubectl-proxyauth
          - runner: macos-13
            goos: darwin
            goarch: amd64
            binary: kubectl-proxyauth
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            binary: kubectl-proxyauth
          - runner: windows-latest
            goos: windows
            goarch: amd64
            binary: kubectl-proxyauth.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦀 Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: stable

      - name: 🧱 Install System Dependencies
        # The plugin stores credentials through `keyring`, which links against
        # libdbus on Linux.
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: 🔨 Build
        run: cargo build --release --bin kubectl_proxyauth

      - name: 📦 Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.gather-facts.outputs.version }}"
          STAGE="$(mktemp -d)"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp dist/target/release/kubectl_proxyauth.exe "$STAGE/${{ matrix.binary }}"
          else
            cp dist/target/release/kubectl_proxyauth "$STAGE/${{ matrix.binary }}"
          fi
          cp LICENSE "$STAGE/"
          ARCHIVE="kubectl-proxyauth_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$STAGE" .
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256" 2>/dev/null || shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: ⬆️ Upload the archive
        uses: actions/upload-artifact@v4 # NOTE: pin to a SHA before merging, like every other action here
        with:
          name: kubectl-proxyauth-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            kubectl-proxyauth_*.tar.gz
            kubectl-proxyauth_*.tar.gz.sha256

  krew-manifest:
    name: 🔌 Render the krew manifest
    permissions:
      contents: read
    needs:
      - gather-facts
      - build-cli
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⬇️ Download the archives
        uses: actions/download-artifact@v4 # NOTE: pin to a SHA before merging, like every other action here
        with:
          path: artifacts
          merge-multiple: true

      - name: 📝 Render the manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.gather-facts.outputs.version }}"
          MANIFEST=".krew/proxyauth.yaml"
          cp .krew/proxyauth.yaml.tpl "$MANIFEST"
          sed -i "s|{{VERSION}}|${VERSION}|g" "$MANIFEST"
          for target in linux_amd64 darwin_amd64 darwin_arm64 windows_amd64; do
            file="artifacts/kubectl-proxyauth_${VERSION}_${target}.tar.gz"
            sum="$(sha256sum "$file" | cut -d' ' -f1)"
            placeholder="{{SHA256_$(echo "$target" | tr '[:lower:]' '[:upper:]')}}"
            sed -i "s|$placeholder|$sum|g" "$MANIFEST"
          done
          # A leftover placeholder means an archive is missing: fail loudly
          # rather than publishing a manifest krew cannot verify.
          ! grep -q "{{" "$MANIFEST"
          cat "$MANIFEST"

      - name: ⬆️ Upload the manifest
        uses: actions/upload-artifact@v4 # NOTE: pin to a SHA before merging, like every other action here
        with:
          name: krew-manifest
          path: .krew/proxyauth.yaml

  create-draft-release:
    permissions:
      contents: write # for softprops/action-gh-release to create GitHub release
    needs:
      - gather-facts
      - build-and-push-back
      - build-and-push-front
      - build-and-push-helm-crd
      - build-and-push-helm
      - build-cli
      - krew-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        run: echo "Create draft release with version ${{ needs.gather-facts.outputs.version }} and name ${{ needs.gather-facts.outputs.name }}"
      - name: 🔍 Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⬇️ Download the plugin archives and krew manifest
        uses: actions/download-artifact@v4 # NOTE: pin to a SHA before merging, like every other action here
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release body
        run: |
          # Read the release template
          TEMPLATE=$(cat .github/release_template.md)
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          CONTRIBUTORS=$(git log --format='%aN' | sort -u | grep -v "dependabot" | grep -v "github-actions" | grep -v "bot" | grep -v "actions" | grep -v "users.noreply.github.com" | paste -sd ", " -)

          # Replace placeholders with actual values
          TEMPLATE=${TEMPLATE//\{\{VERSION\}\}/${{ needs.gather-facts.outputs.version }}}
          TEMPLATE=${TEMPLATE//\{\{RELEASE_DATE\}\}/$RELEASE_DATE}
          TEMPLATE=${TEMPLATE//\{\{CONTRIBUTORS_LIST\}\}/$CONTRIBUTORS}

          # Save the prepared release notes to a file
          echo "$TEMPLATE" > release.md
      # Generate Release Notes and link to the existing changelog
      - name: 📝 Generate Release Notes
        id: generate_release_notes
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ needs.gather-facts.outputs.version }}
          name: ${{ needs.gather-facts.outputs.name }}
          body_path: release.md
          # The krew manifest points at these URLs, so they have to exist on the
          # release before the krew-index PR is opened.
          files: |
            artifacts/kubectl-proxyauth_*.tar.gz
            artifacts/kubectl-proxyauth_*.tar.gz.sha256
            artifacts/proxyauth.yaml
          draft: true
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
