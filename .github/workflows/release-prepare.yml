name: Release Prepare

on:
  push:
    tags:
      - "v*.*.*"

# This workflow is triggered when a new tag matching the pattern "v*.*.*" is pushed.
# It will be split into multiple steps (Max dont forget to update the ci when reaching v0.4.0):
# - Build and push the Docker image to Github
#   - Back
#   - Front
#   - All In One Image (Only in V0.4.0) (contains the back and the front, do i expose the front by the back ?)
# - Build and push the Helm chart to Github
#   - CRD
#   - Chart
# - Create a draft release on github with the generated changelog by Cocogitto

env:
  REGISTRY: ghcr.io
  REPO_NAME_LOWER: ${{ format('{0}', github.event.repository.name) }}
  CHART_BASE_ARTEFACT: ${{ github.repository_owner }}/proxyauthk8s
  IMAGE_NAME_SERVER: ${{ github.repository_owner }}/proxyauthk8s/server
  IMAGE_NAME_FRONT: ${{ github.repository_owner }}/proxyauthk8s/front

permissions:
  contents: read

jobs:
  gather-facts:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      prerelease: ${{ steps.set-version.outputs.prerelease }}
      name: ${{ steps.set-name.outputs.name }}
    steps:
      - name: Set version
        id: set-version
        # A tag with a SemVer pre-release suffix (v0.1.10-rc.1) is a rehearsal:
        # it must not move `latest` and is published as a GitHub pre-release.
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set name
        id: set-name
        run: |
          if [ -z "$GITHUB_HEAD_REF" ]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_HEAD_REF}" >> $GITHUB_OUTPUT
          fi
  # Images are built natively per architecture (no QEMU: the Rust build under
  # emulation takes hours), pushed by digest only, then merged into one
  # multi-arch index that gets the version/latest tags, a signature and an SBOM.
  build-images:
    name: 🐳 Build ${{ matrix.component }} image (${{ matrix.arch }})
    permissions:
      contents: read
      packages: write
    needs: gather-facts
    strategy:
      fail-fast: true
      matrix:
        component: [server, front]
        arch: [amd64, arm64]
        include:
          - component: server
            containerfile: deploy/build/back/Containerfile
          - component: front
            containerfile: deploy/build/front/Containerfile
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 🔍 Checkout release branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: 🔐 Login to Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🏗️ Build and push by digest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/proxyauthk8s/${{ matrix.component }}"
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --file ${{ matrix.containerfile }} \
            --attest type=provenance,mode=max \
            --attest type=sbom \
            --metadata-file build-metadata.json \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            .
          mkdir -p digests
          DIGEST=$(jq -r '."containerimage.digest"' build-metadata.json)
          touch "digests/${DIGEST#sha256:}"
      - name: ⬆️ Upload the digest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish-images:
    name: 🏷️ Publish ${{ matrix.component }} multi-arch image
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    needs:
      - gather-facts
      - build-images
    strategy:
      matrix:
        component: [server, front]
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Download the per-arch digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests
          pattern: digest-${{ matrix.component }}-*
          merge-multiple: true
      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: 🔐 Login to Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🏷️ Create the multi-arch index (version, + latest on a final release)
        id: index
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/proxyauthk8s/${{ matrix.component }}"
          VERSION="${{ needs.gather-facts.outputs.version }}"
          SOURCES=()
          for digest in digests/*; do
            SOURCES+=("$IMAGE@sha256:$(basename "$digest")")
          done
          TAGS=(--tag "$IMAGE:$VERSION")
          if [ "${{ needs.gather-facts.outputs.prerelease }}" != "true" ]; then
            TAGS+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" "${SOURCES[@]}"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=$IMAGE:$VERSION" >> "$GITHUB_OUTPUT"
          echo "digest=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: 🔏 Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: 🔏 Sign the index and every platform image (keyless, GitHub OIDC)
        # Verify with:
        # cosign verify <image> --certificate-identity-regexp 'https://github.com/<owner>/.*' \
        #   --certificate-oidc-issuer https://token.actions.githubusercontent.com
        run: cosign sign --yes --recursive "${{ steps.index.outputs.digest }}"
      - name: 📋 Generate the SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.index.outputs.image }}
          format: cyclonedx-json
          output-file: ${{ matrix.component }}-sbom.json
          upload-artifact: false
          upload-release-assets: false
      - name: ⬆️ Upload the SBOM
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sbom-${{ matrix.component }}
          path: ${{ matrix.component }}-sbom.json

  publish-charts:
    name: ⎈ Publish the ${{ matrix.chart }} Helm chart
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    needs: gather-facts
    strategy:
      matrix:
        chart: [chart-crd, chart]
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout release branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: ⎈ Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: "latest"
      - name: 🔐 Login to the OCI registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" --username "${{ github.actor }}" --password-stdin
      - name: ⎈ Lint, package and push
        id: push
        run: |
          VERSION="${{ needs.gather-facts.outputs.version }}"
          helm lint "deploy/${{ matrix.chart }}"
          # Version the package from the tag, not Chart.yaml: on a release cog
          # already bumped both to the same value, and on a pre-release tag
          # this keeps an rc from re-pushing (overwriting) the last chart.
          APP_VERSION_ARG=()
          if [ "${{ matrix.chart }}" = "chart" ]; then
            APP_VERSION_ARG=(--app-version "$VERSION")
          fi
          helm package "deploy/${{ matrix.chart }}" --destination dist-charts \
            --version "${VERSION#v}" "${APP_VERSION_ARG[@]}"
          PACKAGE=$(ls dist-charts/*.tgz)
          OUTPUT=$(helm push "$PACKAGE" "oci://${{ env.REGISTRY }}/${{ env.CHART_BASE_ARTEFACT }}" 2>&1)
          echo "$OUTPUT"
          REF=$(echo "$OUTPUT" | sed -n 's/^Pushed: //p')
          DIGEST=$(echo "$OUTPUT" | sed -n 's/^Digest: //p')
          if [ -z "$REF" ] || [ -z "$DIGEST" ]; then
            echo "::error::could not read the pushed chart reference/digest" >&2
            exit 1
          fi
          echo "ref=${REF%:*}@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: 🔏 Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: 🔏 Sign the chart (keyless, GitHub OIDC)
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"

  build-cli:
    name: 🔌 Build the kubectl plugin
    permissions:
      contents: read
    needs:
      - gather-facts
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: kubectl-proxyauth
          # macos-13 was retired by GitHub; macos-15-intel is the x86_64 image.
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            binary: kubectl-proxyauth
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            binary: kubectl-proxyauth
          - runner: windows-latest
            goos: windows
            goarch: amd64
            binary: kubectl-proxyauth.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 🦀 Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: stable

      - name: 🧱 Install System Dependencies
        # The plugin stores credentials through `keyring`, which links against
        # libdbus on Linux.
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: 🔨 Build
        run: cargo build --release --bin kubectl_proxyauth

      - name: 📦 Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.gather-facts.outputs.version }}"
          STAGE="$(mktemp -d)"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp dist/target/release/kubectl_proxyauth.exe "$STAGE/${{ matrix.binary }}"
          else
            cp dist/target/release/kubectl_proxyauth "$STAGE/${{ matrix.binary }}"
          fi
          cp LICENSE "$STAGE/"
          ARCHIVE="kubectl-proxyauth_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$STAGE" .
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256" 2>/dev/null || shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: ⬆️ Upload the archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: kubectl-proxyauth-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            kubectl-proxyauth_*.tar.gz
            kubectl-proxyauth_*.tar.gz.sha256

  krew-manifest:
    name: 🔌 Render the krew manifest
    permissions:
      contents: read
    needs:
      - gather-facts
      - build-cli
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: ⬇️ Download the archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: 📝 Render the manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.gather-facts.outputs.version }}"
          MANIFEST=".krew/proxyauth.yaml"
          cp .krew/proxyauth.yaml.tpl "$MANIFEST"
          sed -i "s|{{VERSION}}|${VERSION}|g" "$MANIFEST"
          for target in linux_amd64 darwin_amd64 darwin_arm64 windows_amd64; do
            file="artifacts/kubectl-proxyauth_${VERSION}_${target}.tar.gz"
            sum="$(sha256sum "$file" | cut -d' ' -f1)"
            placeholder="{{SHA256_$(echo "$target" | tr '[:lower:]' '[:upper:]')}}"
            sed -i "s|$placeholder|$sum|g" "$MANIFEST"
          done
          # A leftover placeholder means an archive is missing: fail loudly
          # rather than publishing a manifest krew cannot verify.
          if grep -q "{{" "$MANIFEST"; then
            echo "::error::unresolved placeholder left in $MANIFEST" >&2
            exit 1
          fi
          cat "$MANIFEST"

      - name: ⬆️ Upload the manifest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: krew-manifest
          path: .krew/proxyauth.yaml

  create-draft-release:
    permissions:
      contents: write # for softprops/action-gh-release to create GitHub release
    needs:
      - gather-facts
      - publish-images
      - publish-charts
      - build-cli
      - krew-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        run: echo "Create draft release with version ${{ needs.gather-facts.outputs.version }} and name ${{ needs.gather-facts.outputs.name }}"
      - name: 🔍 Checkout release branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history: the contributors list is read from `git log`.
          fetch-depth: 0
      - name: ⬇️ Download the plugin archives and krew manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release body
        run: |
          # Read the release template
          TEMPLATE=$(cat .github/release_template.md)
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          CONTRIBUTORS=$(git log --format='%aN' | sort -u | grep -v "dependabot" | grep -v "github-actions" | grep -v "bot" | grep -v "actions" | grep -v "users.noreply.github.com" | paste -sd ", " -)

          # Replace placeholders with actual values
          VERSION="${{ needs.gather-facts.outputs.version }}"
          # Charts are versioned without the tag's leading "v".
          CHART_VERSION="${VERSION#v}"
          TEMPLATE=${TEMPLATE//\{\{CHART_VERSION\}\}/$CHART_VERSION}
          TEMPLATE=${TEMPLATE//\{\{VERSION\}\}/$VERSION}
          TEMPLATE=${TEMPLATE//\{\{RELEASE_NAME\}\}/${{ needs.gather-facts.outputs.name }}}
          TEMPLATE=${TEMPLATE//\{\{RELEASE_DATE\}\}/$RELEASE_DATE}
          TEMPLATE=${TEMPLATE//\{\{CONTRIBUTORS_LIST\}\}/$CONTRIBUTORS}

          # Save the prepared release notes to a file
          echo "$TEMPLATE" > release.md
      # Generate Release Notes and link to the existing changelog
      - name: 📝 Generate Release Notes
        id: generate_release_notes
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ needs.gather-facts.outputs.version }}
          name: ${{ needs.gather-facts.outputs.name }}
          body_path: release.md
          # The krew manifest points at these URLs, so they have to exist on the
          # release before the krew-index PR is opened.
          files: |
            artifacts/kubectl-proxyauth_*.tar.gz
            artifacts/kubectl-proxyauth_*.tar.gz.sha256
            artifacts/proxyauth.yaml
            artifacts/server-sbom.json
            artifacts/front-sbom.json
          draft: true
          prerelease: ${{ needs.gather-facts.outputs.prerelease == 'true' }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
