# The integration suite (RFC 0009) needs the k3d bench: the default profile
# (`task test`, CI's cargo jobs) keeps only its unit tests, the `it` profile
# (`task it:test`) runs it alone.
[profile.default]
default-filter = "not package(integration) or kind(lib)"

# No retry, tests isolated by namespace so a few run at once, and a slow test
# is reported at 60 s (RFC 0009 §6.3).
[profile.it]
default-filter = "package(integration)"
retries = 0
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false

# RFC 0013 §6.P point 5 waits out the 5 min refusal key and a requeue: 12 min, not 5.
[[profile.it.overrides]]
filter = "binary(rfc0013) and test(=p5_a_protocol_without_overlap_is_refused_then_recovers)"
slow-timeout = { period = "60s", terminate-after = 12 }

# RFC 0014 §6.P point 13 waits out the 5 min activation of a rotated Issuer
# key and a requeue, then a revocation and the apiserver's JWKS reload.
[[profile.it.overrides]]
filter = "binary(rfc0014) and test(=p13_a_rotation_loses_no_request_and_a_revocation_replaces_the_key)"
slow-timeout = { period = "60s", terminate-after = 15 }
