[package]
name = "jwt_validator"
version = "0.1.9"
edition = "2024"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
base64 = "0.22"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
# `cel` is imported through `kube-cel` (see its docs): declaring a separate
# `cel` dependency risks a version skew that surfaces as a cryptic `Context`
# type mismatch rather than a version error.
kube-cel = "0.8"

crd = { path = "../crd", version = "0.1.9" }
