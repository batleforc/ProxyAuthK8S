[package]
name = "controller"
version = "0.1.9"
edition = "2024"

[dependencies]
tracing = { workspace = true }
kube = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
k8s-openapi = { workspace = true }
tokio = { workspace = true }
deadpool-redis = { workspace = true }
opentelemetry = { workspace = true }
thiserror = { workspace = true }

kube-leader-election = "0.44.0"

crd = { path = "../crd", version = "0.1.9" }
crd_runtime = { path = "../crd_runtime", version = "0.1.9" }
common = { path = "../common", version = "0.1.9" }
trace = { path = "../trace", version = "0.1.9" }

[dev-dependencies]
# `test-util` unlocks `State::from_parts` so tests can build a `State` without
# a live cluster; dev-dependencies are not part of a normal build.
common = { path = "../common", version = "0.1.9", features = ["test-util"] }
# Building a `kube::Client` in tests needs a process-level rustls provider,
# which the server binary installs in `main`.
rustls = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package.metadata.cargo-machete]
ignored = ["k8s-openapi"]
