[package]
name = "controller"
version = "0.4.0"
edition = "2024"
license = "MIT"
# Never published: its git dependency (the kit) is not a wildcard for cargo-deny.
publish = false

[dependencies]
tracing = { workspace = true }
kube = { workspace = true }
serde_json = { workspace = true }
k8s-openapi = { workspace = true }
tokio = { workspace = true }
opentelemetry = { workspace = true }
deadpool-redis = { workspace = true }
thiserror = { workspace = true }
weebo-kit-api = { workspace = true }
weebo-kit-domain = { workspace = true }
weebo-kit-runtime = { workspace = true }
# Already in the tree (rustls, agent_pki): the OneShotToken's randomness.
ring = "0.17"
base64 = "0.23"


crd = { path = "../crd", version = "0.4.0" }
crd_runtime = { path = "../crd_runtime", version = "0.4.0" }
common = { path = "../common", version = "0.4.0" }
trace = { path = "../trace", version = "0.4.0" }

[dev-dependencies]
# `test-util` unlocks `State::from_parts`; dev-dependencies are not part of a
# normal build so the feature stays off outside `cargo test`.
common = { path = "../common", version = "0.4.0", features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rustls = { workspace = true }
wiremock = "0.6"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package.metadata.cargo-machete]
ignored = ["k8s-openapi"]

[lints]
workspace = true
