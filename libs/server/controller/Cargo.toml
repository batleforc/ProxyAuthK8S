[package]
name = "controller"
version = "0.2.1"
edition = "2024"
license = "MIT"

[dependencies]
tracing = { workspace = true }
kube = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
k8s-openapi = { workspace = true }
tokio = { workspace = true }
deadpool-redis = { workspace = true }
thiserror = { workspace = true }

kube-leader-election = "0.44.0"

crd = { path = "../crd", version = "0.2.1" }
crd_runtime = { path = "../crd_runtime", version = "0.2.1" }
common = { path = "../common", version = "0.2.1" }
trace = { path = "../trace", version = "0.2.1" }

[dev-dependencies]
# `test-util` unlocks `State::from_parts`; dev-dependencies are not part of a
# normal build so the feature stays off outside `cargo test`.
common = { path = "../common", version = "0.2.1", features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rustls = { workspace = true }
wiremock = "0.6"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package.metadata.cargo-machete]
ignored = ["k8s-openapi"]
