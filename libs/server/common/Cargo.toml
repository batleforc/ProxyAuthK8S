[package]
name = "common"
version = "0.5.0"
edition = "2024"
license = "MIT"
# Never published: its git dependency (the kit) is not a wildcard for cargo-deny.
publish = false

[features]
# Exposes constructors that bypass the real Kubernetes/Redis/OIDC discovery a
# running server performs at boot. Enabled from dev-dependencies only.
test-util = []

[dependencies]
kube = { workspace = true }
weebo-kit-runtime = { workspace = true }
deadpool-redis = { workspace = true }
tracing = { workspace = true }
rustls = { workspace = true }
openidconnect = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.23"
sha2 = "0.11"
reqwest = { workspace = true }
thiserror = { workspace = true }
k8s-openapi = { workspace = true }
oauth2-reqwest = { workspace = true }

# Already in the tree (reqwest, kube): the CONNECT headers of the agent gateway.
http = "1"
crd = { path = "../crd", version = "0.5.0" }
jwt_validator = { path = "../jwt_validator", version = "0.5.0" }
tokio = { workspace = true, features = ["time", "sync"] }
# Already in the tree (reqwest, kube): the exchange form and its secret (RFC 0010).
form_urlencoded = "1.2.2"
secrecy = "0.10.3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package.metadata.cargo-machete]
ignored = ["k8s-openapi"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }

[lints]
workspace = true
