[package]
name = "api"
version = "0.2.1"
edition = "2024"
license = "MIT"

[features]
default = ["server"]
# `api::server::serve` and its middlewares. Off for the consumers that only
# need the handlers or the OpenAPI document (fuzz/, swaggergen), so they do
# not build the OTLP and CORS stacks.
server = ["dep:trace", "dep:tracing-opentelemetry", "dep:utoipa-scalar", "dep:tower-http", "dep:axum-server", "dep:socket2", "dep:uuid"]
# Opt-in tier that needs a real kube-apiserver and etcd (see `task envtest:setup`).
envtest = []

[dependencies]
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
kube = { workspace = true }
k8s-openapi = { workspace = true }
axum = { workspace = true }
# Already in the tree (kube, reqwest): the request/response types, the
# upgrade of both handshakes, and the client of the upgrade tunnel.
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tracing = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["time"] }
futures-util = { workspace = true }
openidconnect = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
tokio-rustls = { workspace = true }
flate2 = { workspace = true }
base64 = "0.23"
sha2 = "0.11"
subtle = "2"
opentelemetry = { workspace = true }
prometheus = { version = "0.14", default-features = false }
tracing-opentelemetry = { workspace = true, optional = true }
utoipa-scalar = { version = "0.4", features = ["axum"], optional = true }
# 0.6: the version kube already pulls in, so no second copy in the tree.
tower-http = { version = "0.7", features = ["compression-full"], optional = true }
# TLS listener on hyper-util's auto (h1 + h2) server, like weebo-kit-runtime.
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"], optional = true }
# Already in the tree (tokio); binds the listener with a backlog of 2048,
# which a std TcpListener does not let us set.
socket2 = { version = "0.6", optional = true }
# Already in the tree (kube); the request id of every response.
uuid = { version = "1", features = ["v4"], optional = true }

common = { path = "../common", version = "0.2.1" }
crd = { path = "../crd", version = "0.2.1" }
jwt_validator = { path = "../jwt_validator", version = "0.2.1" }
crd_runtime = { path = "../crd_runtime", version = "0.2.1" }
virtual_api = { path = "../virtual_api", version = "0.2.1" }
trace = { path = "../trace", version = "0.2.1", optional = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry-prometheus = "0.33"
# `test-util` unlocks `State::from_parts`; dev-dependencies are not part of a
# normal build so the feature stays off outside `cargo test`.
common = { path = "../common", version = "0.2.1", features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
# Already in the tree (axum): `oneshot` on the router in tests.
tower = { version = "0.5", features = ["util"] }
# Already in the tree (axum): the forms of `harness::test`.
serde_urlencoded = "0.7"
# Already in the tree (kube's dev graph); the http_contract suite's TLS cert.
rcgen = "0.14"
deadpool-redis = { workspace = true }
serde_yaml_ng = { workspace = true }
secrecy = "0.10.3"
# Dev-only, for the envtest reconcile tier: the controller is tested against the
# same ephemeral apiserver the rest of the envtest suite already spins up, rather
# than duplicating that ~460-line harness into the controller crate. No
# production dependency of `api` on `controller` is implied.
controller = { path = "../controller", version = "0.2.1" }
k8s-openapi = { workspace = true }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[test]]
name = "http_contract"
required-features = ["server"]
