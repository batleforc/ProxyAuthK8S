[package]
name = "api"
version = "0.1.9"
edition = "2024"

[features]
# Opt-in tier that needs a real kube-apiserver and etcd (see `task envtest:setup`).
envtest = []

[dependencies]
utoipa = { workspace = true }
utoipa-actix-web = { workspace = true }
kube = { workspace = true }
k8s-openapi = { workspace = true }
actix-web = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
openidconnect = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
tokio-rustls = { workspace = true }
base64 = "0.22"
sha2 = "0.10"

common = { path = "../common", version = "0.1.9" }
crd = { path = "../crd", version = "0.1.9" }
crd_runtime = { path = "../crd_runtime", version = "0.1.9" }
virtual_api = { path = "../virtual_api", version = "0.1.9" }

[dev-dependencies]
# `test-util` unlocks `State::from_parts`; dev-dependencies are not part of a
# normal build so the feature stays off outside `cargo test`.
common = { path = "../common", version = "0.1.9", features = ["test-util"] }
actix-web = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
deadpool-redis = { workspace = true }
serde_yaml = { workspace = true }
secrecy = "0.10.3"
k8s-openapi = { workspace = true }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
