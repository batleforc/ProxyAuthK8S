[package]
name = "crd_runtime"
version = "0.1.9"
edition = "2024"

[dependencies]
kube = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
base64 = "0.23"
secrecy = "0.10.3"

crd = { path = "../crd", version = "0.1.9" }
common = { path = "../common", version = "0.1.9" }

[dev-dependencies]
# `test-util` unlocks `State::from_parts`; dev-dependencies are not part of a
# normal build so the feature stays off outside `cargo test`.
common = { path = "../common", version = "0.1.9", features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
wiremock = "0.6"
rustls = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
