approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

# `task audit:js` accepted advisories — same model as `.cargo/audit.toml`:
# each entry is dated, explains why it is not reachable/fixable here, and says
# what retires it. Anything not listed still fails the audit.
npmAuditIgnoreAdvisories:
  # braces <=3.0.3: stack exhaustion on deeply nested brace patterns
  # (GHSA, npm advisory 1240992). 3.0.3 is the latest release, so there is no
  # fixed version yet. Reached only through micromatch in build/lint tooling,
  # which expands patterns we write, never user input. Accepted 2026-10-10;
  # RETIRE when braces ships a fix (re-check on every `yarn up`).
  - "1240992"
