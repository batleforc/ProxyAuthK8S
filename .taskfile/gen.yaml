version: "3"

tasks:
  tls:trust:
    desc: "Trust the generated TLS certificates in the local system"
    silent: true
    cmds:
      - echo "Trusting the generated TLS certificates in the local system"
      - mkcert -install
  tls:
    desc: "Generate self-signed TLS certificates for local development"
    silent: true
    cmds:
      - echo "Generating self-signed TLS certificates for local development"
      - mkdir -p .tls
      - mkcert -key-file .tls/key.pem -cert-file .tls/cert.pem 127.0.0.1 localhost
  tls-wildcard:
    desc: "Generate self-signed wildcard TLS certificates for local development"
    silent: true
    cmds:
      - echo "Generating self-signed wildcard TLS certificates for local development"
      - mkdir -p .compose/traefik/certs
      - mkcert -key-file .compose/traefik/certs/key.pem -cert-file .compose/traefik/certs/cert.pem '*.k8s.localhost' k8s.localhost
  crds:
    desc: "Generate Custom Resource Definitions"
    silent: true
    cmds:
      - cargo run --bin crdgen
  swagger:
    desc: "Generate Swagger documentation"
    silent: true
    cmds:
      - cargo run --bin swaggergen
  crds-file:
    desc: "Generate Custom Resource Definitions and save to file"
    silent: true
    cmds:
      - task gen:crds > deploy/crds.yaml
      - cp deploy/crds.yaml deploy/chart-crd/templates/crds.yaml
      - sed -i -e 's/{{ "{{" }}/\\{\\{/g' -e 's/{{ "}}" }}/\\}\\}/g' deploy/chart-crd/templates/crds.yaml
  swagger-file:
    desc: "Generate Swagger documentation and save to file"
    silent: true
    cmds:
      - task gen:swagger > swagger.json
      - cp swagger.json .docs/swagger.json
  client:
    desc: "Generate Node and Rust API Clients from OpenAPI specification"
    silent: true
    deps:
      - api-client
      - back-api-client
  back-api-client:
    desc: "Generate backend API client from OpenAPI specification"
    silent: true
    vars:
      RUST_VERSION:
        sh: cat apps/server/Cargo.toml | grep 'version' | head -1 | cut -d '"' -f2
    cmds:
      - echo "Generating backend API client from OpenAPI specification"
      - npx @openapitools/openapi-generator-cli generate -i ./swagger.json -g rust -o./libs/cli/client_api
      - cargo clippy --fix --lib -p client_api --allow-dirty
      - cargo fmt --all
  api-client:
    desc: "Generate API client from OpenAPI specification"
    silent: true
    vars:
      RUST_VERSION:
        sh: cat apps/server/Cargo.toml | grep 'version' | head -1 | cut -d '"' -f2
    cmds:
      - echo "Generating API client from OpenAPI specification"
      - yarn openapi-ts
  api-lint:
    desc: "Lint the OpenAPI specification with Spectral"
    silent: true
    cmds:
      - echo "Linting the OpenAPI specification with Spectral"
      - yarn spectral lint -f sarif -o ./spectral-report.sarif ./swagger.json
  docs:crd:
    desc: "Generate documentation for Custom Resource Definitions"
    silent: true
    vars:
      CRD_YAML: deploy/crds.yaml
      CRD_MDX: .docs/content/docs/crds.mdx
      CRDOC_IMAGE: ghcr.io/fybrik/crdoc:latest
    cmds:
      - echo "Generating documentation for Custom Resource Definitions"
      # The native binary is preferred and pinned in mise.toml
      # ("go:fybrik.io/crdoc"). The container image is only a fallback for an
      # environment without it: `{{.CRDOC_IMAGE}}` has not been rebuilt since
      # January 2023 and produces visibly worse output than a current crdoc — it
      # drops the x-kubernetes-validations lists and links to the v1.20 API docs
      # — so regenerating through it would silently regress the committed page.
      - |
        if command -v crdoc >/dev/null 2>&1; then
          echo "Using the crdoc binary from mise"
          crdoc --resources "{{.CRD_YAML}}" --output "{{.CRD_MDX}}"
        elif command -v docker >/dev/null 2>&1; then
          echo "No crdoc binary found; falling back to docker + the (stale) crdoc image"
          docker run -u "$(id -u):$(id -g)" --rm -v "${PWD}:/workdir" {{.CRDOC_IMAGE}} --resources "/workdir/{{.CRD_YAML}}" --output "/workdir/{{.CRD_MDX}}"
        elif command -v podman >/dev/null 2>&1; then
          echo "No crdoc binary found; falling back to podman + the (stale) crdoc image"
          # --userns=keep-id: rootless podman otherwise maps the caller to a
          # different uid inside the container, and writing the output file onto
          # the bind mount fails with "permission denied".
          podman run --userns=keep-id -u "$(id -u):$(id -g)" --rm -v "${PWD}:/workdir" {{.CRDOC_IMAGE}} --resources "/workdir/{{.CRD_YAML}}" --output "/workdir/{{.CRD_MDX}}"
        else
          echo "Error: need a 'crdoc' binary (run 'mise install'), or docker/podman" >&2
          exit 1
        fi
      - echo "Escaping braces outside inline code spans for MDX/JSX safety"
      # MDX (fumadocs) treats any unescaped '{' as a JSX expression. crdoc emits
      # raw braces from CRD descriptions: double braces ({{username}}/{{group}}),
      # path templates like /apis/{group}/..., and CEL validation regexes. Escape
      # every { and } to \{ \}, but only OUTSIDE inline `code` spans, whose braces
      # must stay raw (a \{ inside backticks would render the backslash literally).
      - perl -i -pe 'my @p=split /(`[^`]*`)/,$_,-1; for(@p){next if /^`.*`$/s; s/(?<!\\)\{/\\{/g; s/(?<!\\)\}/\\}/g} $_=join("",@p);' {{.CRD_MDX}}
      - echo "Add front matter to the generated documentation"
      - .docs/scripts/add-frontmatter.sh --title "Custom Resource Definitions" --icon DraftingCompass --output {{.CRD_MDX}} {{.CRD_MDX}}
