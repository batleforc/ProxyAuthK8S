version: "3"

# Two tiers:
#   - unit tests, pure in-process, no external dependency;
#   - a fast integration tier where the upstream Kubernetes API and the OIDC
#     provider are wiremock stubs and Redis is a real server.
#
# The Redis location comes from TEST_REDIS_URL (default redis://127.0.0.1:6379).
# Without a reachable Redis the integration tests print "SKIPPED" and pass;
# set REQUIRE_TEST_REDIS=1 (as CI does) to turn that into a failure instead.

tasks:
  all:
    desc: "Run every Rust test in the workspace"
    silent: true
    cmds:
      - echo "Running the whole Rust test suite"
      - cargo test --workspace --all-targets
  server:
    desc: "Run the server-side Rust tests only (skips the CLI crates and their system dependencies)"
    silent: true
    cmds:
      - echo "Running the server-side Rust tests"
      - cargo test -p common -p crd -p api -p controller -p server
  unit:
    desc: "Run the unit tests only (no Redis, no network)"
    silent: true
    cmds:
      - echo "Running unit tests"
      - cargo test -p crd -p api --lib
  integration:
    desc: "Run the fast integration tier and fail if the test Redis is unreachable"
    silent: true
    env:
      REQUIRE_TEST_REDIS: "1"
    cmds:
      - echo "Running the fast integration tier against ${TEST_REDIS_URL:-redis://127.0.0.1:6379}"
      - cargo test -p api --test proxy_redirect --test oidc_user
