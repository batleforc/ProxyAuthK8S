                            rule: '!self.parametised || self.path.matches(''^[^{}]*(([{][{](username|group)[}][}])[^{}]*)*$'')'
                      type: object
                    maxItems: 128
                    type: array
                  enabled:
                    default: true
                    description: Whether the token is validated beforehand
                    type: boolean
                  fail2login_equal_ban:
                    default:
                      ban_duration: 300
                      enabled: false
                      exponential_backoff: false
                      max_failed_logins: 5
                    description: Configuration for banning callers after multiple failed authentications
                    properties:
                      ban_duration:
                        default: 300
                        description: |-
                          The duration of the ban in seconds
                          default: 300 (5 minutes)
                          0 means permanent ban
                        format: uint32
                        minimum: 0.0
                        type: integer
                      enabled:
                        default: false
                        description: |-
                          If the feature is enabled
                          default: false
                        type: boolean
                      exponential_backoff:
                        default: false
                        description: |-
                          If the time is exponentially increased with each failed login attempt
                          default: false
                        type: boolean
                      max_failed_logins:
                        default: 5
                        description: |-
                          The number of failed login attempts before the user is banned
                          default: 5
                        format: uint32
                        minimum: 0.0
                        type: integer
                    type: object
                  per_user_group_rate_limiting:
                    default: []
                    description: |-
                      Per group rate limiting configuration
                      This takes precedence over the global rate limiting configuration
                    items:
                      description: |-
                        Per-user group rate limiting configuration

                        Groups come from the user resolved by the configured authentication, so no
                        claim mapping is needed here.
                      properties:
                        group:
                          description: Group name
                          type: string
                        max_requests_per_minute:
                          description: |-
                            The maximum number of requests per minute for this group
                            This setting overrides the global rate limiting setting
                            0 disables the rate limiting for this group
                          format: uint32
                          minimum: 0.0
                          type: integer
                      required:
                      - group
                      - max_requests_per_minute
                      type: object
                    type: array
                  rate_limiting:
                    default:
                      enabled: false
                      max_requests_per_minute: 60
                    description: Global rate limiting configuration
                    properties:
                      enabled:
