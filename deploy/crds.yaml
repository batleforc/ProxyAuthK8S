                            kind:
                              description: The kind of the crd
                              type: string
                            namespace:
                              description: Wether or not the ressource is namespaced, if true, the namespace access rules will be applied to this resource
                              properties:
                                enabled:
                                  default: false
                                  description: |-
                                    If the feature is enabled
                                    default: false
                                  type: boolean
                                rule_kind:
                                  description: The kind of the namespace access rule
                                  oneOf:
                                  - required:
                                    - AllowedNamespaces
                                  - required:
                                    - DeniedNamespaces
                                  - required:
                                    - ParametisedRule
                                  properties:
                                    AllowedNamespaces:
                                      items:
                                        type: string
                                      type: array
                                    DeniedNamespaces:
                                      items:
                                        type: string
                                      type: array
                                    ParametisedRule:
                                      description: |-
                                        The parametised rule is a string that can contain the {{username}} parameter
                                        which will be replaced by the username of the user making the request, and the {{group}} parameter
                                        which will be replaced by the groups of the user making the request
                                        allowed parameters are : {{username}} and {{group}}
                                      type: string
                                  type: object
                              required:
                              - rule_kind
                              type: object
                            namespaced:
                              default: true
                              description: |-
                                Namespaced or not
                                default: true
                              type: boolean
                            plural:
                              description: |-
                                Wether or not the kind has a specific plural form, if true, the plural form will be used in the path instead of the kind
                                for example, if the kind is "`MyResource`" and the plural form is "`MyResources`"
                                the path will be /apis/{group}/{version}/namespaces/{namespace}/myresources/
                                instead of       /apis/{group}/{version}/namespaces/{namespace}/myresource/
                                In case of cluster-scoped crd
                                the path will be /apis/{group}/{version}/myresources/
                                instead of       /apis/{group}/{version}/myresource/
                              nullable: true
                              type: string
                            version:
                              description: The version of the crd
                              type: string
                          required:
                          - group
                          - kind
                          - namespace
                          - version
                          type: object
                        Path:
