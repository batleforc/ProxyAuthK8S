apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: proxykubeapis.weebo.si.rs
spec:
  group: weebo.si.rs
  names:
    kind: ProxyKubeApi
    plural: proxykubeapis
    singular: proxykubeapi
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ProxyKubeApiSpec via `CustomResource`
        properties:
          spec:
            properties:
              auth_config:
                description: Main configuration for authentication
                nullable: true
                properties:
                  disable_validation:
                    default: false
                    description: |-
                      Disable validation of the token against the configured JWT authenticators, OIDC provider or Kubernetes API
                      If the `AuthenticationConfiguration` is not provided, does not validate the token against any of the configured JWT authenticators, OIDC provider or Kubernetes API
                      Default : false
                    type: boolean
                  jwt:
                    default: []
                    description: |-
                      Bounded so the quadratic uniqueness rule above stays inside the
                      apiserver's CEL cost budget — the estimator multiplies this bound by the
                      bound on `issuer.url`, and an unbounded pair is rejected outright. Still
                      far above any real deployment, which trusts a handful of issuers.
                    items:
                      description: |-
                        One trusted JWT issuer and the rules applied to the tokens it mints,
                        mirroring one entry of the apiserver's structured authentication
                        configuration `jwt:` list.
                      properties:
                        claim_mappings:
                          description: How the claims become a username, groups, uid and extra.
                          properties:
                            extra:
                              default: []
                              items:
                                description: One entry of the user's `extra` map, keyed by a domain-prefixed name.
                                properties:
                                  key:
                                    type: string
                                  value_expression:
                                    default: ''
                                    description: A CEL expression over `claims` producing the value(s) for `key`.
                                    type: string
                                required:
                                - key
                                type: object
                              type: array
                            groups:
                              description: |-
                                Either a claim (with an optional prefix) or a CEL expression, never both.

                                `prefix` exists to keep an external identity provider from minting a
                                username that collides with a local one; it applies only to the `claim`
                                form, since an `expression` can prepend whatever it likes itself.
                              nullable: true
                              properties:
                                claim:
                                  maxLength: 253
                                  nullable: true
                                  type: string
                                expression:
                                  maxLength: 4096
                                  nullable: true
                                  type: string
                                prefix:
                                  description: Prepended to the claim's value. Only valid with `claim`.
                                  maxLength: 253
                                  nullable: true
                                  type: string
                              type: object
                              x-kubernetes-validations:
                              - message: exactly one of claim or expression must be set
                                rule: has(self.claim) != has(self.expression)
                              - message: prefix may only be set together with claim
                                rule: '!has(self.prefix) || has(self.claim)'
                              - message: prefix is required with claim (use "" to opt out of prefixing deliberately)
                                rule: '!has(self.claim) || has(self.prefix)'
                            uid:
                              description: Either a claim or a CEL expression, never both.
                              nullable: true
                              properties:
                                claim:
                                  maxLength: 253
                                  nullable: true
                                  type: string
                                expression:
                                  maxLength: 4096
                                  nullable: true
                                  type: string
                              type: object
                              x-kubernetes-validations:
                              - message: exactly one of claim or expression must be set
                                rule: has(self.claim) != has(self.expression)
                            username:
                              description: |-
                                Required — a token that validates but maps to no username authenticates
                                nobody, so the apiserver requires it too.
                              nullable: true
                              properties:
                                claim:
                                  maxLength: 253
                                  nullable: true
                                  type: string
                                expression:
                                  maxLength: 4096
                                  nullable: true
                                  type: string
                                prefix:
                                  description: Prepended to the claim's value. Only valid with `claim`.
                                  maxLength: 253
                                  nullable: true
                                  type: string
                              type: object
                              x-kubernetes-validations:
                              - message: exactly one of claim or expression must be set
                                rule: has(self.claim) != has(self.expression)
                              - message: prefix may only be set together with claim
                                rule: '!has(self.prefix) || has(self.claim)'
                              - message: prefix is required with claim (use "" to opt out of prefixing deliberately)
                                rule: '!has(self.claim) || has(self.prefix)'
                          type: object
                          x-kubernetes-validations:
                          - message: 'claim_mappings.username is required: without it a validated token maps to no user'
                            rule: has(self.username)
                        claim_validation_rules:
                          default: []
                          description: Rules the raw claims must satisfy before any mapping happens.
                          items:
                            description: |-
                              A rule the token's claims must satisfy, mirroring the apiserver's
                              `claimValidationRules`.

                              Two mutually exclusive shapes, exactly as upstream:
                                - `claim` + `required_value`: the named claim must be a string equal to
                                  `required_value`;
                                - `expression` (+ `message`): a CEL expression over `claims` that must
                                  evaluate to `true`.

                              Both halves are optional in the schema because only one may be given; which
                              one was given is checked by [`ClaimValidationRule::validate`] and by the CEL
                              admission rule that mirrors it. Before this was modelled as an either/or, all
                              four fields were required — a rule could not be written at all without
                              supplying nonsense for the half you did not mean.
                            properties:
                              claim:
                                description: The claim whose value must equal `required_value`.
                                maxLength: 253
                                nullable: true
                                type: string
                              expression:
                                description: A CEL expression over `claims` that must evaluate to `true`.
                                maxLength: 4096
                                nullable: true
                                type: string
                              message:
                                default: ''
                                description: |-
                                  Shown when `expression` rejects a token. Required with `expression`: a
                                  rejection nobody can explain is a support ticket, not a security control.
                                maxLength: 1024
                                type: string
                              required_value:
                                default: ''
                                description: |-
                                  The value `claim` must hold. Absent means "the claim must merely be
                                  present", which is how the apiserver reads an empty `requiredValue`.
                                maxLength: 1024
                                type: string
                            type: object
                            x-kubernetes-validations:
                            - message: exactly one of claim or expression must be set
                              rule: has(self.claim) != has(self.expression)
                            - message: required_value may only be set together with claim
                              rule: self.required_value == '' || has(self.claim)
                            - message: an expression rule requires a message explaining what it rejects
                              rule: '!has(self.expression) || self.message != '''''
                          type: array
                        issuer:
                          description: |-
                            The token issuer a [`super::JWTAuthenticator`] trusts, mirroring the
                            apiserver's `issuer`.
                          properties:
                            audience_match_policy:
                              default: MatchAny
                              enum:
                              - MatchAny
                              type: string
                            audiences:
                              default: []
                              description: |-
                                Accepted `aud` values. At least one — an authenticator that accepts any
                                audience is the audience-confusion hole this whole area exists to close.
                              items:
                                type: string
                              type: array
                            certificate_authority:
                              description: |-
                                PEM bundle used to verify the issuer's TLS certificate. Absent means the
                                system trust store.
                              nullable: true
                              type: string
                            discovery_url:
                              description: |-
                                Where the discovery document lives, when it is not `url` +
                                `/.well-known/openid-configuration`.
                              maxLength: 253
                              nullable: true
                              type: string
                            egress_selector:
                              default: controlplane
                              enum:
                              - controlplane
                              - cluster
                              type: string
                            url:
                              description: |-
                                The `iss` claim every token must carry, and the base for OIDC discovery
                                unless `discovery_url` overrides it.
                              maxLength: 253
                              type: string
                          required:
                          - url
                          type: object
                          x-kubernetes-validations:
                          - message: issuer.url must be an https:// URL
                            rule: self.url.startsWith('https://')
                          - message: issuer.audiences must list at least one audience
                            rule: size(self.audiences) > 0
                          - message: issuer.discovery_url must be an https:// URL
                            rule: '!has(self.discovery_url) || self.discovery_url.startsWith(''https://'')'
                        user_validation_rules:
                          default: []
                          description: Rules the *mapped* user must satisfy — e.g. refusing a `system:` prefix.
                          items:
                            description: |-
                              A rule the *mapped* user must satisfy, mirroring the apiserver's
                              `userValidationRules`.

                              Runs after [`super::ClaimMappings`], over a `user` variable — which is what
                              makes it the right place to refuse a username an external IdP should never be
                              able to mint, such as anything under `system:`.
                            properties:
                              expression:
                                default: ''
                                description: A CEL expression over `user` that must evaluate to `true`.
                                maxLength: 4096
                                type: string
                              message:
                                default: ''
                                description: Shown when the rule rejects a user.
                                maxLength: 1024
                                type: string
                            type: object
                            x-kubernetes-validations:
                            - message: a user validation rule requires both an expression and a message
                              rule: self.expression != '' && self.message != ''
                          type: array
                      required:
                      - claim_mappings
                      - issuer
                      type: object
                    maxItems: 8
                    type: array
                  oidc_provider:
                    description: |-
                      An enabled provider that cannot be contacted is a cluster that never
                      authenticates anyone, so the apiserver refuses the CR outright.
                    properties:
                      accept_authorized_party:
                        default: false
                        description: |-
                          Accept a token whose `aud` does not name this service but whose
                          `azp`/`client_id` does.

                          Off by default: `azp`/`client_id` identify the client the token was issued
                          to, not the resource, so accepting them weakens audience validation.
                          Enable only for providers (e.g. Keycloak) that mint self-audience tokens
                          carrying the client only in `azp`.
                        type: boolean
                      audience:
                        default: ''
                        description: |-
                          Audience the access token must carry (its `aud` claim) to be accepted.

                          When empty, `client_id` is used — correct for providers that put the
                          client id in `aud`. Set it explicitly when the provider mints tokens for a
                          distinct resource audience, so `client_id` (who the token is for) and the
                          expected audience (what the token is for) are configured independently.
                        type: string
                      client_id:
                        default: ''
                        description: |-
                          Ignored when the `config_from` Secret carries a `client_id` key. See
                          `issuer_url` for why it is optional.
                        type: string
                      client_secret:
                        description: |-
                          The OAuth client secret, inline.

                          Prefer `config_from`: a value here is readable by anyone with `get` on
                          this resource, shows up in `kubectl get -o yaml`, and is copied into
                          every backup of it.
                        nullable: true
                        type: string
                      config_from:
                        description: |-
                          Read the provider block from an external Secret instead of inlining it
                          here.

                          The Secret's keys are the snake_case field names of this struct —
                          `issuer_url`, `client_id`, `client_secret`, `audience`, `extra_scope` —
                          and any key it carries wins over the inline value; keys it does not carry
                          fall back to the inline value, so a partial Secret (the common case: just
                          `client_secret`) works. Keys outside that set are ignored, since a Secret
                          managed by external-secrets is routinely shared with other consumers.

                          The policy toggles (`enabled`, `accept_authorized_party`,
                          `expose_oauth_authorization_server`) are deliberately *not* readable from
                          the Secret: they decide how strictly tokens are validated and who may
                          reach this cluster, so they must stay visible in the CR that admission
                          and review look at.
                        nullable: true
                        oneOf:
                        - required:
                          - Secret
                        properties:
                          Secret:
                            description: Read the provider block from the keys of a Secret.
                            properties:
                              name:
                                type: string
                              namespace:
                                description: |-
                                  Defaults to the `ProxyKubeApi`'s own namespace. Honoured only when
                                  `PROXYAUTH_ALLOW_CROSS_NS_OIDC` is set — see
                                  [`cross_namespace_oidc_allowed`].
                                nullable: true
                                type: string
                            required:
                            - name
                            type: object
                        type: object
                      enabled:
                        default: false
                        type: boolean
                      expose_oauth_authorization_server:
                        default: false
                        description: |-
                          Expose a mediated OAuth 2.0 Authorization Server (RFC 6749 + PKCE) for
                          this cluster, advertised at `/.well-known/oauth-authorization-server`
                          (RFC 8414), like OpenShift does for its own OAuth server.

                          The proxy itself becomes the authorization server an external caller
                          talks to — `issuer`, `authorization_endpoint`, `token_endpoint`, and
                          `jwks_uri` are all this cluster's own proxy URLs — mediating the whole
                          exchange with the configured `issuer_url` server-side. A caller (e.g.
                          `oc login`, or any RFC-8414-aware tool) never needs to be registered
                          with — or even learn the hostname of — the upstream provider, and no
                          companion `oauth2-proxy` is needed to serve this document.

                          Off by default and unauthenticated by nature (discovery, and the
                          authorization/token endpoints it advertises, must be reachable before
                          a caller has a token): enabling it lets anonymous callers learn that
                          this cluster exists and start a login against it. `redirect_uri` at
                          `/oauth/authorize` is restricted to loopback addresses
                          (`http://localhost`/`http://127.0.0.1`, RFC 8252) since callers are
                          not pre-registered — accepting an arbitrary `redirect_uri` would be an
                          open redirect. Requires `enabled: true`.
                        type: boolean
                      extra_scope:
                        default: ''
                        type: string
                      issuer_url:
                        default: ''
                        description: |-
                          Ignored when the `config_from` Secret carries an `issuer_url` key.
                          Optional only so a `config_from`-only block need not restate it; an
                          enabled provider must end up with a non-empty value from one side or the
                          other.
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: an enabled OIDC provider requires a non-empty issuer_url and client_id, or a config_from reference supplying them
                      rule: '!self.enabled || has(self.config_from) || (self.issuer_url != '''' && self.client_id != '''')'
                    - message: expose_oauth_authorization_server requires the OIDC provider to be enabled
                      rule: '!self.expose_oauth_authorization_server || self.enabled'
                  validate_against:
                    default: Kubernetes
                    description: |-
                      Validate against the configured JWT authenticators, OIDC provider or Kubernetes API
                      Default : `Kubernetes` — the fail-closed choice, valid for every cluster.
                      Selecting `OidcProvider` or `JwtAuthenticators` is always explicit, so a
                      cluster never silently changes how it authenticates because a field was
                      added elsewhere in the spec.
                    enum:
                    - OidcProvider
                    - Kubernetes
                    - JwtAuthenticators
                    type: string
                required:
                - oidc_provider
                type: object
                x-kubernetes-validations:
                - message: validate_against is set to OidcProvider but the OIDC provider is not enabled
                  rule: self.validate_against != 'OidcProvider' || self.oidc_provider.enabled
                - message: validate_against is set to JwtAuthenticators but no jwt authenticator is configured
                  rule: self.validate_against != 'JwtAuthenticators' || size(self.jwt) > 0
                - message: two jwt authenticators are configured for the same issuer; only the first would ever apply
                  rule: self.jwt.all(a, self.jwt.exists_one(b, b.issuer.url == a.issuer.url))
              cert:
                description: Certificate for the Kubernetes API
                oneOf:
                - required:
                  - Secret
                - required:
                  - Cert
                - required:
                  - ConfigMap
                - required:
                  - Insecure
                properties:
                  Cert:
                    description: Base64 encoded cert
                    type: string
                  ConfigMap:
                    description: Configmap
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                      namespace:
                        nullable: true
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  Insecure:
                    description: Insecure, do not use TLS
                    type: boolean
                  Secret:
                    description: Use a cert from a secret
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                      namespace:
                        nullable: true
                        type: string
                    required:
                    - key
                    - name
                    type: object
                type: object
              client_cert:
                description: |-
                  Client certificate presented to the Kubernetes API for mutual TLS
                  Leave unset when the cluster does not require client certificates
                nullable: true
                properties:
                  cert:
                    description: PEM client certificate chain
                    oneOf:
                    - required:
                      - Secret
                    - required:
                      - Cert
                    - required:
                      - ConfigMap
                    - required:
                      - Insecure
                    properties:
                      Cert:
                        description: Base64 encoded cert
                        type: string
                      ConfigMap:
                        description: Configmap
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                          namespace:
                            nullable: true
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      Insecure:
                        description: Insecure, do not use TLS
                        type: boolean
                      Secret:
                        description: Use a cert from a secret
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                          namespace:
                            nullable: true
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                  key:
                    description: PEM private key matching the certificate
                    oneOf:
                    - required:
                      - Secret
                    - required:
                      - Cert
                    - required:
                      - ConfigMap
                    - required:
                      - Insecure
                    properties:
                      Cert:
                        description: Base64 encoded cert
                        type: string
                      ConfigMap:
                        description: Configmap
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                          namespace:
                            nullable: true
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      Insecure:
                        description: Insecure, do not use TLS
                        type: boolean
                      Secret:
                        description: Use a cert from a secret
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                          namespace:
                            nullable: true
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                required:
                - cert
                - key
                type: object
              dashboard_group:
                description: |-
                  If the proxy exposition is accessible via the dashboard
                  the oidc group that allow access to the dashboard, should be unique
                  Default: to the resource namespace + resource name
                nullable: true
                type: string
              enabled:
                default: true
                description: Enable or disable the proxy
                type: boolean
              expose_via_dashboard:
                default: false
                description: |-
                  If the proxy exposition should be accessible via the Dashboard
                  Default: false
                type: boolean
              proxy_group:
                description: |-
                  The oidc group required to proxy requests to this cluster
                  Set it to decouple proxy access from dashboard access
                  Default: the dashboard group when `expose_via_dashboard` is true,
                  otherwise no group is required
                nullable: true
                type: string
              security_config:
                description: Security configuration
                nullable: true
                properties:
                  allowed_resources:
                    default: []
                    description: |-
                      Allowed resources, limit the access to the proxy to only these resources, if empty all resources are allowed

                      The bound keeps the estimated cost of the per-item CEL rules within the
                      budget the apiserver allows for a whole CRD schema.
                    items:
                      description: |-
                        How an allowed resource is described.

                        - `Path` matches on the raw upstream path (with `*`/`**`/`{{...}}` semantics);
                        - `Crd` matches on group/version/kind and applies the per-namespace access
                          rules, translating to a path via [`super::AllowedCrdConfiguration`].
                      oneOf:
                      - required:
                        - Path
                      - required:
                        - Crd
                      properties:
                        Crd:
                          description: |-
                            Allowed crd configuration, used in conjunction with the `allowed_paths` configuration
                            /apis/{group}/{version}/namespaces/{namespace}/{kind}/
                          properties:
                            group:
                              description: The group of the crd
                              type: string
                            kind:
                              description: The kind of the crd
                              type: string
                            namespace:
                              description: Wether or not the ressource is namespaced, if true, the namespace access rules will be applied to this resource
                              properties:
                                enabled:
                                  default: false
                                  description: |-
                                    If the feature is enabled
                                    default: false
                                  type: boolean
                                rule_kind:
                                  description: The kind of the namespace access rule
                                  oneOf:
                                  - required:
                                    - AllowedNamespaces
                                  - required:
                                    - DeniedNamespaces
                                  - required:
                                    - ParametisedRule
                                  properties:
                                    AllowedNamespaces:
                                      items:
                                        type: string
                                      type: array
                                    DeniedNamespaces:
                                      items:
                                        type: string
                                      type: array
                                    ParametisedRule:
                                      description: |-
                                        The parametised rule is a string that can contain the {{username}} parameter
                                        which will be replaced by the username of the user making the request, and the {{group}} parameter
                                        which will be replaced by the groups of the user making the request
                                        allowed parameters are : {{username}} and {{group}}
                                      type: string
                                  type: object
                              required:
                              - rule_kind
                              type: object
                            namespaced:
                              default: true
                              description: |-
                                Namespaced or not
                                default: true
                              type: boolean
                            plural:
                              description: |-
                                Wether or not the kind has a specific plural form, if true, the plural form will be used in the path instead of the kind
                                for example, if the kind is "`MyResource`" and the plural form is "`MyResources`"
                                the path will be /apis/{group}/{version}/namespaces/{namespace}/myresources/
                                instead of       /apis/{group}/{version}/namespaces/{namespace}/myresource/
                                In case of cluster-scoped crd
                                the path will be /apis/{group}/{version}/myresources/
                                instead of       /apis/{group}/{version}/myresource/
                              nullable: true
                              type: string
                            version:
                              description: The version of the crd
                              type: string
                          required:
                          - group
                          - kind
                          - namespace
                          - version
                          type: object
                        Path:
                          description: |-
                            Allowed path configuration, used in conjunction with the `allowed_paths` configuration

                            The CEL rules mirror [`AllowedPathConfiguration::validate`] so a malformed
                            rule is refused at admission rather than at reconcile time.

                            The placeholder regex matches braces through character classes (`[{]`)
                            rather than backslash escapes, for two independent reasons: CEL string
                            literals reject `\{` outright, and the CRD is also shipped as a Helm
                            template where two consecutive `{` would be read as a Go template action.
                          properties:
                            allowed_ports:
                              description: |-
                                Ports a port-forward session matched by this rule may open, as single
                                ports (`"8080"`) or inclusive ranges (`"9000-9100"`)

                                Only used for `.../pods/{name}/portforward` paths. When omitted, the rule
                                does not restrict ports. When several rules match a port-forward, their
                                ports are combined, and one rule without `allowed_ports` lifts the
                                restriction. An empty list allows no port at all.
                              items:
                                description: |-
                                  A port (`"8080"`) or an inclusive port range (`"9000-9100"`).

                                  Ports must be within 1-65535 and a range must not be reversed. Admission
                                  refuses an entry breaking that; one stored before the rule existed is
                                  reported at reconcile time and allows no port.
                                maxLength: 11
                                pattern: ^[0-9]{1,5}(-[0-9]{1,5})?$
                                type: string
                                x-kubernetes-validations:
                                - message: ports must be within 1-65535 and a range must not be reversed
                                  rule: self.split('-').all(p, int(p) >= 1 && int(p) <= 65535) && (!self.contains('-') || int(self.split('-')[0]) <= int(self.split('-')[1]))
                              maxItems: 64
                              nullable: true
                              type: array
                            parametised:
                              default: false
                              description: |-
                                Wether or not the path is parametised
                                if true, the path will be treated as a template, it either handle wildcard parameters, like "*" or "dev-*", or mustache-like parameters, like "{{username}}" or "{{group}}"
                                for example, if the path is "/api/v1/namespaces/*/pods", it will allow all requests to pods in any namespace
                                if the path is "/api/v1/namespaces/dev-*/pods", it will allow all requests to pods in namespaces that start with "dev-"
                                It will also try to detect mustache-like parameters, for example, if the path is "/api/v1/namespaces/{{username}}/pods"
                                it will allow all requests to pods in namespaces carrying the username as a parameter
                                if the selected field is an array, like the groups claim, it will try to match any of the values in the array
                                for example, if the groups claim is ["dev-alice", "dev-bob"] and the path is "/api/v1/namespaces/{{group}}/pods", it will allow all requests to pods in namespaces that match either "dev-alice" or "dev-bob"
                                Allowed parameters are : {{username}} and {{group}}
                                A `*` only matches inside a single path segment; use a `**` segment to
                                match any number of remaining segments (needed for subresources such as
                                "/api/v1/namespaces/dev/pods/mypod/log")
                                default: false
                              type: boolean
                            path:
                              description: |-
                                The path to allow, if the request path equals this path, it will be allowed

                                The length bound is not cosmetic: without it the apiserver assumes an
                                unbounded string and refuses the CEL rule above as too expensive.
                              maxLength: 512
                              type: string
