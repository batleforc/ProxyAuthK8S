image:
  repository: ghcr.io/batleforc/proxyauthk8s/agent
  # Empty: the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

proxy:
  # The proxy's agent gateway, as its agent Ingress exposes it.
  url: wss://agent.proxy.example.com/agent/v1/connect
  # namespace/name of the ProxyKubeApi this agent serves (required).
  cluster: ""
  # The CA of `url`, PEM (private PKI, Netbird); empty = the system roots.
  caBundle: ""
# Must be the proxy's (agentGateway.tlsMode): inner or passthrough.
tlsMode: inner
# The agent's one destination: this cluster's apiserver.
upstream: https://kubernetes.default.svc:443
egress:
  proxy:
    # http://… (CONNECT) or socks5h://… (socks5:// resolves names locally).
    # Empty: HTTPS_PROXY / ALL_PROXY / NO_PROXY from `env`, else direct.
    # With networkPolicy, add the proxy to egressTo and its port to egressPorts.
    url: ""
    # A Secret of this namespace with the keys `username` and `password`.
    credentialsSecret: ""
bootstrap:
  # ServiceAccountToken: the ProxyKubeApi's `subject` is this release's
  # ServiceAccount, system:serviceaccount:<namespace>:<release>-proxyauthk8s-agent;
  # no RBAC. OneShotToken: the token the proxy's controller wrote, carried
  # here in `tokenSecret`; the identity goes to `identitySecret`.
  method: ServiceAccountToken
  # ServiceAccountToken: the `aud` of the projected token, the ProxyKubeApi's
  # `audience`.
  audience: proxyauth
  expirationSeconds: 3600
  # OneShotToken: a Secret of this namespace with the key `token` (an
  # ExternalSecret fed by the proxy's <name>-agent-bootstrap, say).
  tokenSecret: ""
  # ExternalCA: no enrolment. The certificate comes from your issuer
  # (cert-manager, Vault PKI) with the URI SAN proxyauth://<proxy.cluster>
  # and the `client auth` usage, in the TLS Secret `secretName`. With an
  # `issuerRef`, the chart writes that cert-manager Certificate itself.
  certificate:
    secretName: proxyauth-agent-cert
    issuerRef: {}  # { name: vault-issuer, kind: ClusterIssuer, group: cert-manager.io }
    duration: 72h
    renewBefore: 24h
# ExternalCA with tlsMode inner: the proxy's agent CA, PEM (ca.crt of its
# Secret proxy-auth-k8s-agent-ca, public), which anchors the tunnel TLS.
tunnelCa: ""
# OneShotToken: the key and certificate the replicas share, created empty by
# the chart; the agent may `get` and `update` this Secret only (§6.5, T16).
identitySecret: proxyauth-agent-identity

# A CronJob, under a ServiceAccount of its own, copying this cluster's
# /openid/v1/jwks into `configMap` (key jwks.json): carry it to the proxy's
# `jwks_from` with External Secrets (decision 24). The agent keeps no RBAC.
jwksPublisher:
  enabled: false
  schedule: "*/15 * * * *"
  configMap: proxyauth-agent-jwks

replicaCount: 2
podDisruptionBudget:
  enabled: true
  minAvailable: 1
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 20m
    memory: 32Mi
env: []

networkPolicy:
  # Egress only: DNS, then `egressTo` (the proxy and this cluster's
  # apiserver) on `egressPorts`. Empty `egressTo`: any destination on those
  # ports. The apiserver's address is cluster-specific: set it.
  enabled: false
  egressTo: []
  egressPorts: [443, 6443]

securityContext:
  pod:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    privileged: false
    capabilities:
      drop:
        - ALL
