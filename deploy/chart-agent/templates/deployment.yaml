{{- if not (has .Values.tlsMode (list "inner" "passthrough")) }}
{{- fail "tlsMode: inner or passthrough (the proxy's agentGateway.tlsMode)" }}
{{- end }}
{{- $oneShot := eq .Values.bootstrap.method "OneShotToken" }}
{{- $external := eq .Values.bootstrap.method "ExternalCA" }}
{{- if not (has .Values.bootstrap.method (list "ServiceAccountToken" "OneShotToken" "ExternalCA")) }}
{{- fail "bootstrap.method: ServiceAccountToken, OneShotToken or ExternalCA" }}
{{- end }}
{{- if and $external (eq .Values.tlsMode "inner") (not .Values.tunnelCa) }}
{{- fail "tunnelCa is required with ExternalCA and tlsMode inner: the proxy's agent CA (ca.crt of its Secret proxy-auth-k8s-agent-ca)" }}
{{- end }}
{{- if and $oneShot (not .Values.bootstrap.tokenSecret) }}
{{- fail "bootstrap.tokenSecret is required with OneShotToken" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "agent.name" . }}"
  namespace: "{{ .Release.Namespace }}"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: "{{ include "agent.name" . }}"
  template:
    metadata:
      labels:
        app: "{{ include "agent.name" . }}"
    spec:
      serviceAccountName: "{{ include "agent.name" . }}"
      # Only the projected tokens below: no default API token in the pod.
      automountServiceAccountToken: false
      {{- with .Values.securityContext.pod }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}'
          imagePullPolicy: '{{ .Values.image.pullPolicy }}'
          {{- with .Values.securityContext.container }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: probes
              containerPort: 9090
          env:
            - name: AGENT_PROXY_URL
              value: {{ .Values.proxy.url | quote }}
            - name: AGENT_CLUSTER
              value: {{ required "proxy.cluster is required (namespace/name of the ProxyKubeApi)" .Values.proxy.cluster | quote }}
            - name: AGENT_UPSTREAM
              value: {{ .Values.upstream | quote }}
            - name: AGENT_TLS_MODE
              value: {{ .Values.tlsMode | quote }}
            {{- if $oneShot }}
            - name: AGENT_BOOTSTRAP_METHOD
              value: OneShotToken
            - name: AGENT_TOKEN_PATH
              value: /var/run/secrets/proxyauth-bootstrap/token
            - name: AGENT_IDENTITY_SECRET
              value: {{ .Values.identitySecret | quote }}
            - name: AGENT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AGENT_API_TOKEN_PATH
              value: /var/run/secrets/proxyauth/api-token
            {{- else if $external }}
            - name: AGENT_BOOTSTRAP_METHOD
              value: ExternalCA
            - name: AGENT_TLS_CERT_PATH
              value: /var/run/secrets/proxyauth-cert/tls.crt
            - name: AGENT_TLS_KEY_PATH
              value: /var/run/secrets/proxyauth-cert/tls.key
            {{- if .Values.tunnelCa }}
            - name: AGENT_TUNNEL_CA_PATH
              value: /etc/proxyauth/tunnel-ca/ca.crt
            {{- end }}
            {{- else }}
            - name: AGENT_TOKEN_PATH
              value: /var/run/secrets/proxyauth/token
            {{- end }}
            - name: AGENT_KUBE_CA_PATH
              value: /var/run/secrets/proxyauth/ca.crt
            {{- if .Values.proxy.caBundle }}
            - name: AGENT_PROXY_CA_BUNDLE
              value: /etc/proxyauth/proxy-ca/ca.crt
            {{- end }}
            {{- with .Values.egress.proxy.url }}
            - name: AGENT_EGRESS_PROXY_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.egress.proxy.credentialsSecret }}
            - name: AGENT_EGRESS_PROXY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: username
            - name: AGENT_EGRESS_PROXY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: password
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            periodSeconds: 20
          # Ready while its tunnel is open.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            periodSeconds: 10
          volumeMounts:
            - name: proxyauth
              mountPath: /var/run/secrets/proxyauth
              readOnly: true
            {{- if .Values.proxy.caBundle }}
            - name: proxy-ca
              mountPath: /etc/proxyauth/proxy-ca
              readOnly: true
            {{- end }}
            {{- if $oneShot }}
            - name: bootstrap
              mountPath: /var/run/secrets/proxyauth-bootstrap
              readOnly: true
            {{- end }}
            {{- if $external }}
            # Not a subPath: the issuer's renewals reach the files.
            - name: certificate
              mountPath: /var/run/secrets/proxyauth-cert
              readOnly: true
            {{- if .Values.tunnelCa }}
            - name: tunnel-ca
              mountPath: /etc/proxyauth/tunnel-ca
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: proxyauth
          projected:
            sources:
              {{- if $oneShot }}
              # The API token for the identity Secret, the one RBAC grant.
              - serviceAccountToken:
                  expirationSeconds: {{ .Values.bootstrap.expirationSeconds }}
                  path: api-token
              {{- else if not $external }}
              # The enrolment proof, `aud` = the ProxyKubeApi's audience.
              - serviceAccountToken:
                  audience: {{ .Values.bootstrap.audience | quote }}
                  expirationSeconds: {{ .Values.bootstrap.expirationSeconds }}
                  path: token
              {{- end }}
              # This cluster's CA, whose fingerprint `status.agent` shows.
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        {{- if .Values.proxy.caBundle }}
        - name: proxy-ca
          configMap:
            name: "{{ include "agent.name" . }}-proxy-ca"
        {{- end }}
        {{- if $oneShot }}
        - name: bootstrap
          secret:
            secretName: {{ .Values.bootstrap.tokenSecret | quote }}
            items:
              - key: token
                path: token
        {{- end }}
        {{- if $external }}
        - name: certificate
          secret:
            secretName: {{ .Values.bootstrap.certificate.secretName | quote }}
        {{- if .Values.tunnelCa }}
        - name: tunnel-ca
          configMap:
            name: "{{ include "agent.name" . }}-tunnel-ca"
        {{- end }}
        {{- end }}
