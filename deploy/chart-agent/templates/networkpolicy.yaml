{{- if .Values.networkPolicy.enabled }}
# The agent dials out only: no ingress but the kubelet's probes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "{{ include "agent.name" . }}"
  namespace: "{{ .Release.Namespace }}"
spec:
  podSelector:
    matchLabels:
      app: "{{ include "agent.name" . }}"
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - {{- with .Values.networkPolicy.egressTo }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        {{- range .Values.networkPolicy.egressPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
