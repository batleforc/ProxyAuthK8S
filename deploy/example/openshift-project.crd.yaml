# Exposes `project.openshift.io/v1 Projects` on top of a vanilla cluster's
# Namespaces, so an oc-flavoured client can run `kubectl get projects`.
# See .docs/content/docs/virtual-apis.mdx for the known limitations.
apiVersion: weebo.si.rs/v1
kind: ProxyKubeApi
metadata:
  name: local-openshift-compat
  namespace: default
spec:
  cert:
    Insecure: true
  service:
    KubernetesService:
      name: kubernetes
      namespace: default
      port: 443
  virtual_apis:
    - kind: OpenShiftProject
      enabled: true
