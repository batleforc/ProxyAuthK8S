# Rendered by the image's entrypoint (envsubst, NGINX_ENVSUBST_FILTER=PROXYAUTHK8S_)
# from the values 15-csp.envsh validated: never edit the result in conf.d.
# Copied to /etc/nginx/templates/default.conf.template by the Containerfile.
server {

  listen 4200;

  # GZIP
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

  # RFC 0002 §6.6. Server level, and no add_header in the locations below, so
  # every location inherits them. `script-src` allows the bundle and the one
  # inline theme script by its hash; `connect-src`/`frame-src` the API and the
  # IdP origins the container was given ('self' alone without them).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' ${PROXYAUTHK8S_CSP_THEME_HASH}; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'${PROXYAUTHK8S_CSP_CONNECT}; frame-src 'self'${PROXYAUTHK8S_CSP_FRAME}; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  # The copy env.sh fills at startup, not the image's /app.
  location / {
    root   /tmp/app;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  error_page  500 502 503 504  /50x.html;
  error_page  404 /index.html;

  location = /50x.html {
    root   /tmp/app;
  }

  location = /index.html {
    root   /tmp/app;
  }
}
