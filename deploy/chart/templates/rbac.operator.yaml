# Role for Operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: "{{ .Release.Name }}-proxyauthk8s-operator-role"
  namespace: "{{ .Release.Namespace }}"
  labels:
    app: "{{ .Release.Name }}-proxyauthk8s-operator"
rules:
  # Permissions to read CRDs, allow Operator to make sure they exist
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  # Permissions to reconcile ProxyKubeAPI custom resources. The controller only
  # reads them and writes status/finalizers (via patch on the object); the CRs
  # are authored by admins, so it needs neither `create` nor `delete`.
  - apiGroups:
      - "weebo.si.rs"
    resources:
      - "proxykubeapis"
    verbs:
      - get
      - list
      - watch
      - update
      - patch
{{- if not .Values.rbac.referencedNamespaces }}
  # CA / client certificates and OIDC material referenced by a ProxyKubeApi
  # (CertSource::Secret / ConfigMap) and the Services it targets. The code only
  # ever `get`s them by name, so no list/watch. Set rbac.referencedNamespaces to
  # replace this cluster-wide grant with per-namespace Roles.
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
      - services
    verbs:
      - get
{{- end }}
---
# RoleBinding for Operator Service Account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: "{{ .Release.Name }}-proxyauthk8s-operator-rolebinding"
  labels:
    app: "{{ .Release.Name }}-proxyauthk8s-operator"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: "{{ .Release.Name }}-proxyauthk8s-operator-role"
subjects:
  - kind: ServiceAccount
    name: "{{ .Release.Name }}-proxyauthk8s-operator"
    namespace: "{{ .Release.Namespace }}"
---
# Leader election: the controller holds a coordination.k8s.io Lease in its own
# namespace (LEASE_NAMESPACE, set from the pod namespace). Only the replica
# holding the lease reconciles; without these verbs no replica ever becomes
# leader and the proxy never learns about any ProxyKubeApi.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ .Release.Name }}-proxyauthk8s-leader-election"
  namespace: "{{ .Release.Namespace }}"
  labels:
    app: "{{ .Release.Name }}-proxyauthk8s-operator"
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ .Release.Name }}-proxyauthk8s-leader-election"
  namespace: "{{ .Release.Namespace }}"
  labels:
    app: "{{ .Release.Name }}-proxyauthk8s-operator"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ .Release.Name }}-proxyauthk8s-leader-election"
subjects:
  - kind: ServiceAccount
    name: "{{ .Release.Name }}-proxyauthk8s-operator"
    namespace: "{{ .Release.Namespace }}"
{{- range .Values.rbac.referencedNamespaces }}
---
# Read access to the Secrets / ConfigMaps / Services a ProxyKubeApi may
# reference, limited to this namespace (rbac.referencedNamespaces).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ $.Release.Name }}-proxyauthk8s-referenced"
  namespace: "{{ . }}"
  labels:
    app: "{{ $.Release.Name }}-proxyauthk8s-operator"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
      - services
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ $.Release.Name }}-proxyauthk8s-referenced"
  namespace: "{{ . }}"
  labels:
    app: "{{ $.Release.Name }}-proxyauthk8s-operator"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ $.Release.Name }}-proxyauthk8s-referenced"
subjects:
  - kind: ServiceAccount
    name: "{{ $.Release.Name }}-proxyauthk8s-operator"
    namespace: "{{ $.Release.Namespace }}"
{{- end }}