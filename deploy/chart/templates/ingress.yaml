# Expose ProxyKubeAPI via Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Release.Namespace }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
        {{- with .Values.ingress.apiHost }}
        - {{ . }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "proxyauthk8s.front.name" . }}
                port:
                  number: {{ .Values.front.port }}
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: {{ include "proxyauthk8s.back.name" . }}
                port:
                  number: {{ .Values.back.port }}
          - path: /clusters/
            pathType: Prefix
            backend:
              service:
                name: {{ include "proxyauthk8s.back.name" . }}
                port:
                  number: {{ .Values.back.port }}
    {{- with .Values.ingress.apiHost }}
    # Clusters only (#277): `oc login` probes `HEAD /` of the server's host and
    # gives up on the dashboard's HTML. `/` is the back's empty 404; nothing
    # else (`/api/`, `/management/`) is routed on this host.
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: {{ include "proxyauthk8s.back.name" $ }}
                port:
                  number: {{ $.Values.back.port }}
          - path: /clusters/
            pathType: Prefix
            backend:
              service:
                name: {{ include "proxyauthk8s.back.name" $ }}
                port:
                  number: {{ $.Values.back.port }}
    {{- end }}
