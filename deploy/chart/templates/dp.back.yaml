# Make a deployment for the back application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-proxyauthk8s-back"
  namespace: "{{ .Release.Namespace }}"
spec:
  {{- if not .Values.back.autoscaling.enabled }}
  replicas: {{ .Values.back.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-proxyauthk8s-back"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-proxyauthk8s-back"
      {{- if and .Values.metrics.prometheus.enabled (not .Values.metrics.serviceMonitor.enabled) }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /management/metrics
        prometheus.io/port: "{{ .Values.back.port }}"
      {{- end }}
    spec:
      serviceAccountName: "{{ .Release.Name }}-proxyauthk8s-operator"
      terminationGracePeriodSeconds: {{ add .Values.back.shutdownTimeoutSeconds 15 }}
      automountServiceAccountToken: true
      {{- include "proxyauthk8s.podSecurityContext" . | nindent 6 }}
      containers:
        - name: proxyauthk8s-back
          image: '{{ .Values.registry.back.image.repository }}:{{ .Values.registry.back.image.tag | default .Chart.AppVersion }}'
          imagePullPolicy: '{{ .Values.registry.back.image.pullPolicy }}'
          {{- include "proxyauthk8s.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.back.port }}
          env:
            - name: SERVER_PORT
              value: "{{ .Values.back.port }}"
            - name: ENV
              value: "production"
            - name: CORS_ALLOWED_ORIGINS
              value: '{{ .Values.back.corsAllowedOrigins | default (printf "%s://%s" (ternary "https" "http" .Values.ingress.tls.enabled) .Values.ingress.host) }}'
            - name: SERVER_SHUTDOWN_TIMEOUT
              value: "{{ .Values.back.shutdownTimeoutSeconds }}"
            - name: LOG_FORMAT
              value: "{{ .Values.back.logFormat }}"
            - name: METRICS_PROMETHEUS_ENABLED
              value: "{{ .Values.metrics.prometheus.enabled }}"
            # Leader-election lease lives next to the pod (see rbac.operator.yaml).
            - name: LEASE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: API_CLUSTER_OIDC_FRONT_REDIRECT_URL
              value: '{{ if .Values.ingress.tls.enabled }}https{{ else }}http{{ end }}://{{ .Values.ingress.host }}'
            - name: API_CLUSTER_OIDC_BASE_REDIRECT_URL
              value: '{{ if .Values.ingress.tls.enabled }}https{{ else }}http{{ end }}://{{ .Values.ingress.host }}'
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: '{{ .Release.Name }}-otel-collector:4317'
            {{- end }}
            {{- if eq .Values.back.redis.source "env" }}
            - name: REDIS_URL
              value: '{{ include "proxyauthk8s.redisUrl" . }}'
            {{- end }}
            {{- if eq .Values.oidc.source "env" }}
            - name: OIDC_ISSUER_URL
              value: '{{ .Values.oidc.value.issuer_url }}'
            - name: OIDC_CLIENT_ID
              value: '{{ .Values.oidc.value.client_id }}'
            - name: OIDC_CLIENT_SECRET
              value: '{{ .Values.oidc.value.client_secret }}'
            - name: OIDC_SCOPES
              value: '{{ .Values.oidc.value.scopes }}'
            - name: OIDC_AUDIENCE
              value: '{{ .Values.oidc.value.audience }}'
            {{- end }}
            {{- range .Values.back.env }}
            - name: {{ .name }}
              value: {{ .value }}
            {{- end }}
          envFrom:
            {{- if eq .Values.oidc.source "secret" }}
            - secretRef:
                name: '{{ .Values.oidc.objectName }}'
            {{- end }}
            {{- if eq .Values.back.redis.source "secret" }}
            - secretRef:
                name: '{{ .Values.back.redis.secretName }}'
            {{- end }}
          resources:
            {{- with .Values.back.resources }}
            limits:
              {{- with .limits }}
              cpu: {{ .cpu }}
              memory: {{ .memory }}
              {{- end }}
            requests:
              {{- with .requests }}
              cpu: {{ .cpu }}
              memory: {{ .memory }}
              {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /management/health
              port: {{ .Values.back.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
          # Readiness checks Redis (every proxied call needs it); liveness above
          # deliberately does not, so a Redis outage takes pods out of rotation
          # instead of restarting them.
          readinessProbe:
            httpGet:
              path: /management/ready
              port: {{ .Values.back.port }}
            initialDelaySeconds: 10
            periodSeconds: 20
          # readOnlyRootFilesystem still needs somewhere to write scratch files.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
