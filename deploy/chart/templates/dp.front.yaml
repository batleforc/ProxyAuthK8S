# Deployment for Frontend Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-proxyauthk8s-front"
  namespace: "{{ .Release.Namespace }}"
spec:
  {{- if not .Values.front.autoscaling.enabled }}
  replicas: {{ .Values.front.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-proxyauthk8s-front"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-proxyauthk8s-front"
    spec:
      {{- include "proxyauthk8s.podSecurityContext" . | nindent 6 }}
      containers:
        - name: proxyauthk8s-front
          image: '{{ .Values.registry.front.image.repository }}:{{ .Values.registry.front.image.tag }}'
          imagePullPolicy: '{{ .Values.registry.front.image.pullPolicy }}'
          {{- include "proxyauthk8s.containerSecurityContext" . | nindent 10 }}
          ports:
            - containerPort: {{ .Values.front.port }}
          env:
            - name: ENV
              value: "production"
            - name: PROXYAUTHK8S_FRONT_API_BASE_URL
              value: '{{ if .Values.ingress.tls.enabled }}https{{ else }}http{{ end }}://{{ .Values.ingress.host }}'
            {{- if eq .Values.oidc.source "env" }}
            - name: PROXYAUTHK8S_FRONT_OIDC_ISSUER_URL
              value: '{{ .Values.oidc.value.issuer_url }}'
            - name: PROXYAUTHK8S_FRONT_OIDC_CLIENT_ID
              value: '{{ .Values.oidc.value.client_id }}'
            - name: PROXYAUTHK8S_FRONT_OIDC_SCOPE
              value: '{{ .Values.oidc.value.scopes }}'
            - name: "PROXYAUTHK8S_FRONT_OIDC_SILENT_REFRESH"
              value: "{{ .Values.oidc.value.silent_refresh }}"
            {{- end }}
            {{- range .Values.front.env }}
            - name: {{ .name }}
              value: {{ .value }}
            {{- end }}
          resources:
            {{- with .Values.front.resources }}
            limits:
              {{- with .limits }}
              cpu: {{ .cpu }}
              memory: {{ .memory }}
              {{- end }}
            requests:
              {{- with .requests }}
              cpu: {{ .cpu }}
              memory: {{ .memory }}
              {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.front.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.front.port }}
            initialDelaySeconds: 10
            periodSeconds: 20
          # A static web server writes its cache and pid under /tmp and /var/run,
          # which readOnlyRootFilesystem would otherwise deny.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}