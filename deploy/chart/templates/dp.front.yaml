# Deployment for Frontend Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-proxyauthk8s-front"
  namespace: "{{ .Release.Namespace }}"
spec:
  {{- include "proxyauthk8s.replicas" (dict "root" . "name" (printf "%s-proxyauthk8s-front" .Release.Name) "replicas" .Values.front.replicas "autoscaling" .Values.front.autoscaling) | nindent 2 }}
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-proxyauthk8s-front"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-proxyauthk8s-front"
    spec:
      {{- include "proxyauthk8s.podSecurityContext" . | nindent 6 }}
      containers:
        - name: proxyauthk8s-front
          image: '{{ .Values.registry.front.image.repository }}:{{ .Values.registry.front.image.tag | default .Chart.AppVersion }}'
          imagePullPolicy: '{{ .Values.registry.front.image.pullPolicy }}'
          {{- include "proxyauthk8s.containerSecurityContext" . | nindent 10 }}
          ports:
            - containerPort: {{ .Values.front.port }}
          env:
            - name: ENV
              value: "production"
            - name: PROXYAUTHK8S_FRONT_API_BASE_URL
              value: '{{ include "proxyauthk8s.publicUrl" . }}'
            {{- if eq .Values.oidc.source "env" }}
            - name: PROXYAUTHK8S_FRONT_OIDC_ISSUER_URL
              value: '{{ .Values.oidc.value.issuer_url }}'
            - name: PROXYAUTHK8S_FRONT_OIDC_CLIENT_ID
              value: '{{ .Values.oidc.value.client_id }}'
            - name: PROXYAUTHK8S_FRONT_OIDC_SCOPE
              value: '{{ .Values.oidc.value.scopes }}'
            - name: "PROXYAUTHK8S_FRONT_OIDC_SILENT_REFRESH"
              value: "{{ .Values.oidc.value.silent_refresh }}"
            {{- else if eq .Values.oidc.source "secret" }}
            # Same secret as the backend, renamed to the front's variables. Only
            # the public parts are read: the client secret never reaches the front.
            - name: PROXYAUTHK8S_FRONT_OIDC_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: '{{ .Values.oidc.objectName }}'
                  key: OIDC_ISSUER_URL
            - name: PROXYAUTHK8S_FRONT_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: '{{ .Values.oidc.objectName }}'
                  key: OIDC_CLIENT_ID
            - name: PROXYAUTHK8S_FRONT_OIDC_SCOPE
              valueFrom:
                secretKeyRef:
                  name: '{{ .Values.oidc.objectName }}'
                  key: OIDC_SCOPES
            - name: "PROXYAUTHK8S_FRONT_OIDC_SILENT_REFRESH"
              value: "{{ .Values.oidc.value.silent_refresh }}"
            {{- end }}
            {{- range .Values.front.env }}
            - name: {{ .name }}
              value: {{ .value }}
            {{- end }}
          resources:
            {{- with .Values.front.resources }}
            limits:
              {{- with .limits }}
              cpu: {{ .cpu }}
              memory: {{ .memory }}
              {{- end }}
            requests:
              {{- with .requests }}
              cpu: {{ .cpu }}
              memory: {{ .memory }}
              {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.front.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.front.port }}
            initialDelaySeconds: 10
            periodSeconds: 20
          # readOnlyRootFilesystem: nginx writes its cache and pid under /tmp
          # and /var/run, the entrypoint renders its config into conf.d, and
          # env.sh fills a copy of the bundle under /tmp/app.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: conf
          emptyDir: {}
