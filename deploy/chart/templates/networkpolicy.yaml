{{- if .Values.networkPolicy.enabled }}
{{- $dns := dict "ports" (list (dict "port" 53 "protocol" "UDP") (dict "port" 53 "protocol" "TCP")) }}
# Backend: reached only by the exposure layer, reaches only what it needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "{{ include "proxyauthk8s.back.name" . }}-netpol"
  namespace: "{{ .Release.Namespace }}"
spec:
  podSelector:
    matchLabels:
      app: "{{ include "proxyauthk8s.back.name" . }}"
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {{- if .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      {{- else }}
      # No selector configured: every pod in the cluster may reach the backend.
      # Set networkPolicy.ingressFrom to your ingress controller.
      {{- end }}
      ports:
        - port: {{ .Values.back.port }}
          protocol: TCP
    {{- if and .Values.agentGateway.enabled (eq .Values.agentGateway.mode "embedded") }}
    {{- include "proxyauthk8s.gateway.netpolIngress" . | nindent 4 }}
    {{- end }}
    {{- if and .Values.metrics.prometheus.enabled .Values.metrics.scrapeFrom }}
    # Prometheus scraping /management/metrics.
    - from:
        {{- toYaml .Values.metrics.scrapeFrom | nindent 8 }}
      ports:
        - port: {{ .Values.back.port }}
          protocol: TCP
    {{- end }}
  egress:
    # DNS, without which nothing else resolves.
    - to:
        - namespaceSelector: {}
      ports:
        {{- toYaml $dns.ports | nindent 8 }}
    {{- if .Values.networkPolicy.egress.allowExternal }}
    # Target cluster apiservers and OIDC providers live outside the cluster.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with .Values.networkPolicy.egress.externalExcept }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
    {{- end }}
    {{- if and .Values.agentGateway.enabled (eq .Values.agentGateway.mode "separate") }}
    # CONNECT to the agent gateway's pods.
    - to:
        - podSelector:
            matchLabels:
              app: "{{ include "proxyauthk8s.gateway.name" . }}"
      ports:
        - port: {{ .Values.agentGateway.connectPort }}
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if and .Values.agentGateway.enabled (eq .Values.agentGateway.mode "separate") }}
---
# Agent gateway: the agents through the exposure layer, CONNECT from the back
# only (T18); egress as the back's (Redis, the apiserver, `jwks_url` issuers).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "{{ include "proxyauthk8s.gateway.name" . }}-netpol"
  namespace: "{{ .Release.Namespace }}"
spec:
  podSelector:
    matchLabels:
      app: "{{ include "proxyauthk8s.gateway.name" . }}"
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- include "proxyauthk8s.gateway.netpolIngress" . | nindent 4 }}
    {{- if and .Values.metrics.prometheus.enabled .Values.metrics.scrapeFrom }}
    # Prometheus scraping the gateway's /metrics.
    - from:
        {{- toYaml .Values.metrics.scrapeFrom | nindent 8 }}
      ports:
        - port: {{ .Values.agentGateway.metricsPort }}
          protocol: TCP
    {{- end }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        {{- toYaml $dns.ports | nindent 8 }}
    {{- if .Values.networkPolicy.egress.allowExternal }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with .Values.networkPolicy.egress.externalExcept }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
---
# Frontend: static assets, reached by the exposure layer, needs only DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "{{ include "proxyauthk8s.front.name" . }}-netpol"
  namespace: "{{ .Release.Namespace }}"
spec:
  podSelector:
    matchLabels:
      app: "{{ include "proxyauthk8s.front.name" . }}"
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {{- if .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      {{- end }}
      ports:
        - port: {{ .Values.front.port }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        {{- toYaml $dns.ports | nindent 8 }}
{{- if .Values.otel.enabled }}
---
# Collector: reached by the backend only, and by nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "{{ include "proxyauthk8s.otel.name" . }}-netpol"
  namespace: "{{ .Release.Namespace }}"
spec:
  podSelector:
    matchLabels:
      app: "{{ include "proxyauthk8s.otel.name" . }}"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: "{{ include "proxyauthk8s.back.name" . }}"
      ports:
        - port: 4317
          protocol: TCP
{{- end }}
{{- end }}
