{{- if and .Values.agentGateway.enabled (not .Values.agentGateway.tokenSecretName) }}
{{- $name := include "proxyauthk8s.gateway.tokenSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
# The CONNECT token (T18), generated once and kept across upgrades.
apiVersion: v1
kind: Secret
metadata:
  name: "{{ $name }}"
  namespace: "{{ .Release.Namespace }}"
type: Opaque
data:
  token: {{ if $existing }}{{ index $existing.data "token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
