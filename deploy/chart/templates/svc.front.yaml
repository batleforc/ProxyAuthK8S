# Service for Frontend Application
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-proxyauthk8s-front"
  namespace: "{{ .Release.Namespace }}"
spec:
  selector:
    app: "{{ .Release.Name }}-proxyauthk8s-front"
  ports:
    - protocol: TCP
      port: {{ .Values.front.port }}
      targetPort: {{ .Values.front.port }}
  type: ClusterIP
