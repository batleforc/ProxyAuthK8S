{{- if .Values.agentGateway.enabled }}
# Headless: one DNS name per gateway pod, for the back's CONNECT (decision 25).
apiVersion: v1
kind: Service
metadata:
  name: "{{ include "proxyauthk8s.gateway.headless" . }}"
  namespace: "{{ .Release.Namespace }}"
spec:
  clusterIP: None
  selector:
    app: "{{ include "proxyauthk8s.gateway.podApp" . }}"
  ports:
    - name: connect
      protocol: TCP
      port: {{ .Values.agentGateway.connectPort }}
      targetPort: {{ .Values.agentGateway.connectPort }}
---
# The agents' listener, behind the agent ingress. No CONNECT port here.
apiVersion: v1
kind: Service
metadata:
  name: "{{ include "proxyauthk8s.gateway.name" . }}"
  namespace: "{{ .Release.Namespace }}"
spec:
  selector:
    app: "{{ include "proxyauthk8s.gateway.podApp" . }}"
  ports:
    - name: agents
      protocol: TCP
      port: {{ .Values.agentGateway.port }}
      targetPort: {{ .Values.agentGateway.port }}
  type: ClusterIP
{{- end }}
