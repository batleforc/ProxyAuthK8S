{{- if .Values.back.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: "{{ include "proxyauthk8s.back.name" . }}-hpa"
  namespace: "{{ .Release.Namespace }}"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: "{{ include "proxyauthk8s.back.name" . }}"
  minReplicas: {{ .Values.back.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.back.autoscaling.maxReplicas }}
  metrics:
    {{- with .Values.back.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with .Values.back.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
{{- end }}
---
