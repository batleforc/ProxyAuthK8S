{{- if and .Values.back.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: "{{ include "proxyauthk8s.back.name" . }}-pdb"
  namespace: "{{ .Release.Namespace }}"
spec:
  {{- include "proxyauthk8s.pdbBudget" (dict "pdb" .Values.back.podDisruptionBudget "min" (include "proxyauthk8s.minReplicas" (dict "replicas" .Values.back.replicas "autoscaling" .Values.back.autoscaling))) | nindent 2 }}
  selector:
    matchLabels:
      app: "{{ include "proxyauthk8s.back.name" . }}"
{{- end }}
---
{{- if and .Values.front.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: "{{ include "proxyauthk8s.front.name" . }}-pdb"
  namespace: "{{ .Release.Namespace }}"
spec:
  {{- include "proxyauthk8s.pdbBudget" (dict "pdb" .Values.front.podDisruptionBudget "min" (include "proxyauthk8s.minReplicas" (dict "replicas" .Values.front.replicas "autoscaling" .Values.front.autoscaling))) | nindent 2 }}
  selector:
    matchLabels:
      app: "{{ include "proxyauthk8s.front.name" . }}"
{{- end }}
---
{{- if and .Values.agentGateway.enabled (eq .Values.agentGateway.mode "separate") .Values.agentGateway.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: "{{ include "proxyauthk8s.gateway.name" . }}-pdb"
  namespace: "{{ .Release.Namespace }}"
spec:
  {{- include "proxyauthk8s.pdbBudget" (dict "pdb" .Values.agentGateway.podDisruptionBudget "min" (include "proxyauthk8s.minReplicas" (dict "replicas" .Values.agentGateway.replicaCount "autoscaling" .Values.agentGateway.autoscaling))) | nindent 2 }}
  selector:
    matchLabels:
      app: "{{ include "proxyauthk8s.gateway.name" . }}"
{{- end }}
