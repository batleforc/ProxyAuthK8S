# Traefik of the bench (k3s' bundled chart), mounted by .it/k3d.yaml.tpl.
# websecure on 8443 inside the cluster too, so every URL carries the port the
# host publishes; a pinned ClusterIP so hostAliases can name it beforehand.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      websecure:
        exposedPort: 8443
    service:
      spec:
        clusterIP: 10.43.0.200
    # RFC 0010 §6.P point 6: a stopped IdP answers 503 through its Ingress,
    # as a down upstream does, not a 404 for a route that went away.
    providers:
      kubernetesIngress:
        allowEmptyServices: true
