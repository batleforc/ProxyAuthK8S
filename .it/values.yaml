# Chart values of the integration bench (RFC 0009 §6.1): an ordinary values
# file, nothing here changes the product's behaviour.
registry:
  front:
    image:
      repository: localhost/proxyauthk8s/front
      tag: it
      pullPolicy: Never
  back:
    image:
      repository: localhost/proxyauthk8s/server
      tag: it
      pullPolicy: Never

ingress:
  host: proxyauth.k8s.localhost
  publicUrl: https://proxyauth.k8s.localhost:8443
  # oc login --web (RFC 0008 §6.P point 3); `*.k8s.localhost` is in the run's cert.
  apiHost: api.k8s.localhost
  tls:
    enabled: true
    secretName: proxyauthk8s-tls

oidc:
  source: secret
  objectName: proxyauthk8s-back-oidc
  value:
    silent_refresh: "false"

back:
  # One pod: audit lines and metrics are read from it (RFC 0009 §15, 33).
  replicas: 1
  logFormat: json
  redis:
    source: env
    value:
      url: redis://redis:6379
  podDisruptionBudget:
    enabled: false
  # Trust the run's CA when calling Dex (discovery, token exchange).
  env:
    - name: SSL_CERT_FILE
      value: /etc/proxyauth-it/rootCA.pem
    # RFC 0008 §6.P point 1: the audit must get through a restrictive level.
    - name: RUST_LOG
      value: warn
    # RFC 0010 §6.P point 9: the unscoped fail2login counts (it is off when
    # unset); high enough that the shared ingress address is never banned.
    - name: UNSCOPED_MAX_FAILED_LOGINS
      value: "1000"
  extraVolumes:
    - name: it-ca
      secret:
        secretName: it-ca
  extraVolumeMounts:
    - name: it-ca
      mountPath: /etc/proxyauth-it
      readOnly: true

# RFC 0014 §6.P: every mode is exercised (TokenExchange by RFC 0010 §6.P); a
# mode outside allowedModes is proved by the unit tests (§17.3).
upstreamAuth:
  allowedModes: [Passthrough, FrontProxy, Issuer, TokenExchange]

front:
  replicas: 1
  podDisruptionBudget:
    enabled: false

metrics:
  prometheus:
    enabled: true

# RFC 0012 §6.P: the agent gateway, 2 pods (decision 26), its agents' Ingress
# on agent.k8s.localhost; the agents themselves are installed per test.
agentGateway:
  enabled: true
  mode: separate
  replicaCount: 2
  # Point 8: the controller writes the OneShotToken Secrets.
  oneShotToken:
    enabled: true
  ingress:
    enabled: true
    host: agent.k8s.localhost
    tls:
      enabled: true
      secretName: proxyauthk8s-tls
