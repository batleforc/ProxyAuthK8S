
[workspace]
resolver = '2'
members = [
  'libs/server/crd',
  'libs/server/crd_runtime',
  'apps/server',
  'libs/server/trace',
  'apps/crdgen',
  'apps/swaggergen',
  'libs/server/api',
  'libs/server/virtual_api',
  'libs/server/jwt_validator',
  'libs/server/controller',
  'libs/server/common',
  'apps/kubectl_proxyauth',
  'libs/cli/cli_trace',
  'libs/cli/client_api',
  'libs/cli/cli',
]

[workspace.dependencies]
actix-web = { version = '4', features = ['rustls-0_23'] }
tokio = { version = '1', features = ['macros', 'rt-multi-thread'] }
tokio-stream = '0.1'
anyhow = '1'
utoipa = { version = '6', features = ['actix_extras'] }
utoipa-actix-web = { version = '0.2' }
k8s-openapi = { version = '0', features = ['v1_34'] }
serde = { version = '1', features = ['derive'] }
serde_json = '1'
serde_yaml_ng = '0.10'
tracing = { version = '0.1', features = ['std'] }
kube = { version = '4', features = ['derive', 'runtime', 'client'] }
reqwest = { version = '0.13.2', features = ['json', 'rustls', 'stream'] }
schemars = { version = '1' }
futures-util = '0.3'
deadpool-redis = { version = '0.23', features = ['serde', 'cluster'] }
opentelemetry = { version = '0.32', features = ['trace', 'metrics', 'logs'] }
opentelemetry_sdk = { version = '0.32', features = [
  'trace',
  'metrics',
  'rt-tokio',
] }
# default-features = false drops the `http-proto` / `reqwest-blocking-client`
# defaults: the exporters here are tonic-only, and those defaults were the sole
# reason `reqwest` 0.12 was built alongside the pinned 0.13.
opentelemetry-otlp = { version = '0.32', default-features = false, features = [
  'grpc-tonic',
  'trace',
  'metrics',
  'logs',
  'internal-logs',
  'serialize',
] }
tracing-subscriber = { version = '0.3', features = [
  'env-filter',
  'registry',
  'std',
  'fmt',
] }
tracing-opentelemetry = { version = '0.33' }
rustls = { version = '0.23', features = ['ring'], default-features = false }
rustls-platform-verifier = '0.7'
tokio-rustls = '0.26'
flate2 = { version = '1.1', default-features = false, features = ['zlib-rs'] }
# default-features = false disables openidconnect's `reqwest` feature, which
# routes to `oauth2/reqwest` and pins reqwest 0.12. `oauth2-reqwest` is the
# upstream (same author) adapter that provides the same `AsyncHttpClient` over
# reqwest 0.13; it is pre-release only because it is new, not unstable. Both
# lines move together — see todo.md before touching either.
openidconnect = { version = '4.0.1', default-features = false }
oauth2-reqwest = "0.1.0-alpha.3"
thiserror = { version = '2' }
regex = "1.12.3"


[profile.release]
lto = true
