
[workspace]
resolver = '2'
members = [
  'libs/server/crd',
  'libs/server/crd_runtime',
  'apps/server',
  'libs/server/trace',
  'apps/crdgen',
  'apps/swaggergen',
  'libs/server/api',
  'libs/server/virtual_api',
  'libs/server/jwt_validator',
  'libs/server/controller',
  'libs/server/common',
  'apps/kubectl_proxyauth',
  'libs/cli/cli_trace',
  'libs/cli/client_api',
  'libs/cli/cli',
  'tests/integration',
  'libs/agent/proto',
]

[workspace.dependencies]
axum = '0.8'
tokio = { version = '1', features = ['macros', 'rt-multi-thread'] }
anyhow = '1'
utoipa = { version = '6', features = ['axum_extras'] }
utoipa-axum = '0.3'
# The only Kubernetes version feature of the graph (RFC 0011): the kit's
# libraries enable none. envtest runs at this same version
# (ENVTEST_K8S_VERSION in back-envtest.yaml and .tasks/envtest.yaml).
k8s-openapi = { version = '0.28', features = ['v1_34'] }
# The kit's crates, by git on a tag: double quotes, the form pin-kit.sh
# (kit:sync) rewrites, and only in this file.
weebo-kit-api = { git = "https://github.com/batleforc/weebo-operator-kit", tag = "v0.24.0" }
weebo-kit-domain = { git = "https://github.com/batleforc/weebo-operator-kit", tag = "v0.24.0" }
weebo-kit-runtime = { git = "https://github.com/batleforc/weebo-operator-kit", tag = "v0.24.0" }
serde = { version = '1', features = ['derive'] }
serde_json = '1'
serde_yaml_ng = '0.10'
tracing = { version = '0.1', features = ['std'] }
kube = { version = '4', features = ['derive', 'runtime', 'client'] }
reqwest = { version = '0.13.2', features = ['json', 'rustls', 'stream'] }
schemars = { version = '1' }
futures-util = '0.3'
deadpool-redis = { version = '0.23', features = ['serde', 'cluster'] }
opentelemetry = { version = '0.33', features = ['trace', 'metrics', 'logs'] }
opentelemetry_sdk = { version = '0.33', features = [
  'trace',
  'metrics',
  'rt-tokio',
] }
# default-features = false drops the `http-proto` / `reqwest-blocking-client`
# defaults: the exporters here are tonic-only, and those defaults were the sole
# reason `reqwest` 0.12 was built alongside the pinned 0.13.
opentelemetry-otlp = { version = '0.33', default-features = false, features = [
  'grpc-tonic',
  'trace',
  'metrics',
  'logs',
  'internal-logs',
] }
tracing-subscriber = { version = '0.3', features = [
  'env-filter',
  'registry',
  'std',
  'fmt',
] }
tracing-opentelemetry = { version = '0.34' }
rustls = { version = '0.23', features = ['ring'], default-features = false }
rustls-platform-verifier = '0.7'
tokio-rustls = '0.26'
flate2 = { version = '1.1', default-features = false, features = ['zlib-rs'] }
# default-features = false disables openidconnect's `reqwest` feature, which
# routes to `oauth2/reqwest` and pins reqwest 0.12. `oauth2-reqwest` is the
# upstream (same author) adapter that provides the same `AsyncHttpClient` over
# reqwest 0.13; it is pre-release only because it is new, not unstable. Both
# lines move together; pinned exactly so a `cargo update` cannot pull a newer
# alpha into the auth path unnoticed. Re-check when `oauth2` 6 ships or
# `oauth2-reqwest` 0.1.0 stable lands.
openidconnect = { version = '4.0.1', default-features = false }
oauth2-reqwest = "=0.1.0-alpha.3"
thiserror = { version = '2' }
regex = "1.12.3"


# weebo-operator-kit's house lints (kit v0.22.0, RFC 0011 phase 6). Each crate
# opts in with `[lints] workspace = true` once it is clean; the generated
# `client_api` never does (decision 32). Tests are exempt through clippy.toml.
[workspace.lints.rust]
unsafe_code = "deny"                      # LANG-UNSAFE; "deny", not "forbid": #[expect(unsafe_code, reason)] must stay possible for FFI
unsafe_op_in_unsafe_fn = "deny"
let_underscore_drop = "warn"

[workspace.lints.clippy]
# Panics. Tests are exempt via clippy.toml; test helpers lift them per module.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
# Integer overflow: checked_/saturating_/wrapping_ instead of bare operators.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
# Errors are handled, never dropped.
let_underscore_must_use = "deny"
let_underscore_future = "deny"
mem_forget = "deny"
# Every escape hatch carries its justification, and dies with the code it excused.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"


[profile.release]
lto = true
