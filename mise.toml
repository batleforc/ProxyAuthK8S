[tools]
bun = "latest"
helm = "latest"
java = "temurin"
k3d = "latest"
# Same minor as the k3s of .it/images.lock: the client of the RFC 0009 suite.
kubectl = "1.35"
"aqua:kubernetes-sigs/krew" = "latest"
mkcert = "latest"
node = "lts"
rust = { version = "latest", profile = "default", components = "rust-src,llvm-tools" }
talosctl = "latest"
task = "latest"
pnpm = "latest"
yq = "latest"
jq = "latest"
gitleaks = "latest"
actionlint = "latest"
shellcheck = "latest"
claude = "latest"
rtk = "latest"
cocogitto = "latest"
uv = "latest"
# Called by the kit's shared tasks (rust:audit, repo:lint, repo:audit).
cargo-deny = "latest"
hadolint = "latest"
trivy = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"go:fybrik.io/crdoc" = "latest"
"pipx:desloppify[full]" = "latest"
"pipx:graphifyy" = "latest"
cargo-binstall = "latest"
"github:batleforc/weebo-skillsagent" = "0.10.0"
go = "latest"
"cargo:cargo-machete" = "latest"
