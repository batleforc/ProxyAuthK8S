[tools]
bun = "latest"
helm = "latest"
java = "temurin"
k3d = "latest"
# Same minor as the k3s of .it/images.lock: the client of the RFC 0009 suite.
kubectl = "1.35"
"aqua:kubernetes-sigs/krew" = "latest"
mkcert = "latest"
# The HTTP load scenarios of RFC 0016 (tests/perf/k6, task perf:http).
k6 = "2.3"
node = "lts"
rust = { version = "latest", profile = "default", components = "rust-src,llvm-tools" }
talosctl = "latest"
task = "latest"
pnpm = "latest"
yq = "latest"
jq = "latest"
# Same version as secret-scan.yaml, so a local run reproduces the CI gate.
gitleaks = "8.30.1"
actionlint = "latest"
shellcheck = "latest"
claude = "latest"
rtk = "latest"
cocogitto = "latest"
uv = "latest"
# Called by the kit's shared tasks (rust:audit, repo:lint, repo:audit).
cargo-deny = "latest"
# RUSTSEC check of every lockfile (task audit:cargo).
"aqua:rustsec/rustsec/cargo-audit" = "latest"
hadolint = "latest"
trivy = "latest"
# Static analysis (Rust / TS / secrets rulesets), run by semgrep.yaml.
semgrep = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"
# RFC 0015 §6.5: mutation testing of the security crates (task mutants:run).
"cargo:cargo-mutants" = "latest"
"pipx:desloppify[full]" = "latest"
"pipx:graphifyy" = "latest"
cargo-binstall = "latest"
"github:batleforc/weebo-skillsagent" = "0.17.0"
go = "latest"
"cargo:cargo-machete" = "latest"
# CycloneDX SBOM of the Rust binaries (task sbom:rust).
"cargo:cargo-cyclonedx" = "latest"
oc = { version = "latest", bin = "oc", checksum_url = "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ version }}/sha256sum.txt", version_expr = "sortVersions(versions)", version_list_url = "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/", version_regex = 'href="(\d+\.\d+\.\d+)/"', platforms = { linux-x64 = { url = "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ version }}/openshift-client-linux.tar.gz" }, linux-arm64 = { url = "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ version }}/openshift-client-linux-arm64.tar.gz" }, macos-x64 = { url = "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ version }}/openshift-client-mac.tar.gz" }, macos-arm64 = { url = "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ version }}/openshift-client-mac-arm64.tar.gz" }, windows-x64 = { url = "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ version }}/openshift-client-windows.zip" } } }
